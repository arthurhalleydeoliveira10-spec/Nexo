<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<title>Nexo — converse, fale e jogue com seus amigos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4f9a'/%3E%3Cstop offset='.55' stop-color='%238b5cff'/%3E%3Cstop offset='1' stop-color='%234de1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Cpath d='M18 46V18h6l16 18V18h6v28h-6L24 28v18z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0c0a18;--bg1:#141127;--bg2:#1a1631;--bg3:#241f40;--bg4:#2f2952;--bg5:#3c3566;
  --tx:#f3f0ff;--tx2:#b5aed6;--tx3:#7c74a3;
  --ac:#ff4f9a;--ac2:#ec3a87;--acs:rgba(255,79,154,.15);--on-ac:#fff;--cy:#4de1ff;--vi:#8b5cff;
  --grad:linear-gradient(135deg,#ff4f9a 0%,#8b5cff 55%,#4de1ff 100%);
  --red:#ff5468;--yel:#ffc857;--blue:#6ec9ff;--green:#3ee08f;
  --line:rgba(190,175,255,.08);--mention:rgba(255,200,87,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --disp:'Bricolage Grotesque',Onest,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg0);color:var(--tx);font-family:Onest,system-ui,sans-serif;font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:var(--ac);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{display:flex;height:100%;padding-top:var(--sat)}

/* ---------- trilho de servidores ---------- */
#rail{width:76px;background:var(--bg0);display:flex;flex-direction:column;align-items:center;padding:14px 0 calc(14px + var(--sab));gap:10px;overflow-y:auto;flex-shrink:0;scrollbar-width:none}
.sv{width:50px;height:50px;border-radius:17px;background:var(--bg3);display:grid;place-items:center;font-size:22px;font-weight:700;font-family:var(--disp);transition:transform .15s,box-shadow .2s,border-radius .2s;position:relative;flex-shrink:0;color:#fff;overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sv:hover{transform:translateY(-1px);border-radius:14px}
.sv:active{transform:scale(.94)}
.sv.on{border-radius:14px;box-shadow:0 0 0 2px var(--bg0),0 0 0 4px var(--ac),0 6px 18px rgba(255,79,154,.35)}
.sv::before{content:"";position:absolute;left:-13px;width:5px;height:0;background:var(--grad);border-radius:0 5px 5px 0;transition:height .2s}
.sv.unread::before{height:8px}.sv:hover::before{height:20px}.sv.on::before{height:36px}
.sv .badge{position:absolute;bottom:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);border:3px solid var(--bg0);font-size:10px;font-family:Onest;display:grid;place-items:center;padding:0 3px;box-sizing:content-box}
.sv .vc{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--bg0);display:grid;place-items:center}
.sv .vc svg{width:10px;height:10px;stroke:#062b18;stroke-width:3}
.sv.add,.sv.join{color:var(--tx2);background:transparent;box-shadow:inset 0 0 0 1.5px var(--bg4)}
.sv.add:hover,.sv.join:hover{color:#fff;background:var(--grad);box-shadow:none}
.sep{width:28px;height:2px;background:var(--bg3);border-radius:2px;flex-shrink:0}

/* ---------- barra lateral ---------- */
#side{width:256px;background:var(--bg1);display:flex;flex-direction:column;flex-shrink:0;border-radius:18px 0 0 0}
#sideHead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:17px;cursor:pointer;gap:8px;flex-shrink:0;border-radius:18px 0 0 0}
#sideHead:hover{background:rgba(255,255,255,.03)}
#sideHead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chans{flex:1;overflow-y:auto;padding:8px 10px}
.cat{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--tx3);padding:18px 6px 6px}
.cat button{color:var(--tx3);display:grid;width:24px;height:24px;place-items:center;border-radius:6px}.cat button:hover{color:var(--tx);background:var(--bg3)}
.cat svg.i{width:16px;height:16px}
.ch{position:relative;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;color:var(--tx3);cursor:pointer;margin-bottom:2px;min-height:38px;transition:background .12s,color .12s}
.ch svg.i{width:18px;height:18px}
.ch:hover{background:rgba(255,255,255,.04);color:var(--tx2)}
.ch.on{background:var(--bg3);color:var(--tx)}
.ch.on svg.i{color:var(--ac)}
.ch.unread{color:var(--tx);font-weight:600}
.ch.unread::before{content:"";position:absolute;left:-10px;width:4px;height:8px;background:var(--tx);border-radius:0 4px 4px 0}
.ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .x{opacity:0;color:var(--tx3);display:grid}.ch:hover .x{opacity:1}.ch .x svg{width:16px;height:16px}
.ch .cnt{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;font-weight:700}
.vusers{padding:2px 0 8px 30px}
.vu{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:8px;font-size:13.5px;color:var(--tx2)}
.vu:hover{background:rgba(255,255,255,.03)}
.vu .av{width:24px;height:24px;font-size:11px}
.vu .ic{margin-left:auto;display:flex;gap:4px;color:var(--tx3);align-items:center}.vu .ic svg{width:14px;height:14px}
.vu .live{background:var(--red);color:#fff;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:.02em}

/* ---------- chamada em andamento (lateral) ---------- */
#vbar{margin:0 10px 8px;padding:12px;display:none;border-radius:14px;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
#vbar.on{display:block}
#vbar .st{color:var(--green);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
#vbar .st svg{width:16px;height:16px}
#vbar .wh{font-size:12px;color:var(--tx3);cursor:pointer;margin-top:2px}
#vbar .wh:hover{color:var(--tx2);text-decoration:underline}
#vbar .bt{display:flex;gap:6px;margin-top:10px}
#vbar .bt button{flex:1;height:34px;border-radius:9px;background:var(--bg3);display:grid;place-items:center;color:var(--tx2)}
#vbar .bt button:hover{background:var(--bg4);color:var(--tx)}
#vbar .bt button.on{background:var(--acs);color:var(--ac)}
#vbar .bt button.bad{color:var(--red)}
#me{height:62px;background:var(--bg0);display:flex;align-items:center;gap:4px;padding:0 8px;margin:0 10px calc(10px + var(--sab));border-radius:16px;flex-shrink:0}
#me .who{flex:1;display:flex;gap:10px;align-items:center;min-width:0;padding:6px;border-radius:12px;cursor:pointer}
#me .who:hover{background:var(--bg3)}
#me .info{min-width:0}
#me .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp)}
#me .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
#me .mb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx2)}
#me .mb svg{width:18px;height:18px}
#me .mb:hover{background:var(--bg3);color:var(--tx)}
#me .mb.bad{color:var(--red);background:rgba(255,84,104,.12)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--disp);color:#fff;flex-shrink:0;position:relative;font-size:14px;background-size:cover;background-position:center}
.av .st{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg1)}
.st.online{background:var(--green)}.st.ausente{background:var(--yel)}.st.ocupado{background:var(--red)}.st.offline{background:#5d5680}
.av.speak{box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--green)}

/* ---------- área principal ---------- */
#main{flex:1;display:flex;flex-direction:column;background:var(--bg2);min-width:0;position:relative}
#top{height:58px;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0;background:rgba(26,22,49,.85);backdrop-filter:blur(12px);z-index:2}
#top .t{font-family:var(--disp);font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
#top .t svg{color:var(--tx3)}
#top .topic{color:var(--tx3);font-size:13px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:12px;margin-left:4px;border-left:1px solid var(--bg4)}
.sp1{flex:1}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex-shrink:0;position:relative}
.ib:hover{background:var(--bg3);color:var(--tx)}
.ib.on{color:var(--ac);background:var(--acs)}
#search{background:var(--bg0);border:1px solid transparent;border-radius:10px;padding:8px 12px;width:170px;font-size:13px;outline:none;transition:width .2s,border-color .2s}
#search:focus{width:230px;border-color:var(--bg5)}
#search::placeholder{color:var(--tx3)}
#burger{display:none}
#banner{background:var(--yel);color:#2a1d00;font-size:13px;padding:8px 14px;text-align:center;display:none;font-weight:600}
#banner.on{display:block}#banner.red{background:var(--red);color:#fff}
#body{flex:1;display:flex;min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:12px 0 10px;overscroll-behavior:contain}

/* ---------- mensagens ---------- */
.welcome{padding:28px 22px 18px}
.welcome .big{width:76px;height:76px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:36px;margin-bottom:16px;color:#fff;box-shadow:0 10px 30px rgba(139,92,255,.35)}
.welcome .big svg{width:38px;height:38px}
.welcome h2{font-family:var(--disp);font-size:32px;margin-bottom:6px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.welcome p{color:var(--tx2);line-height:1.55;max-width:60ch}
.daysep{display:flex;align-items:center;gap:10px;margin:18px 22px 4px;color:var(--tx3);font-size:12px;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--bg4)}
.m{display:flex;gap:14px;padding:3px 22px;position:relative}
.m.first{margin-top:14px}
.m:hover{background:rgba(255,255,255,.03)}
.m.first .a{letter-spacing:-.005em}
.m.mention{background:var(--mention);box-shadow:inset 3px 0 0 var(--yel)}
.m.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--acs)}}
.m .av{width:42px;height:42px;font-size:16px;cursor:pointer;margin-top:2px}
.m .gut{width:42px;flex-shrink:0;font-size:10px;color:transparent;text-align:right;padding-top:4px}
.m:hover .gut{color:var(--tx3)}
.m .c{flex:1;min-width:0}
.m .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.m .a{font-family:var(--disp);font-weight:700;cursor:pointer;font-size:15.5px}.m .a:hover{text-decoration:underline}
.m .tm{font-size:11.5px;color:var(--tx3)}
.m .tx{line-height:1.5;word-wrap:break-word;white-space:pre-wrap;color:#e6e1fa;max-width:80ch}
.m .tx.big{font-size:44px;line-height:1.2}
.m .ed{font-size:10.5px;color:var(--tx3)}
.m .tx code{font-family:'JetBrains Mono',monospace;background:var(--bg0);padding:1px 6px;border-radius:5px;font-size:13px;color:var(--cy)}
.m .tx pre{font-family:'JetBrains Mono',monospace;background:var(--bg0);padding:12px 14px;border-radius:10px;font-size:13px;margin:6px 0;white-space:pre-wrap;border:1px solid var(--line)}
.m .tx blockquote{border-left:3px solid var(--vi);padding-left:10px;color:var(--tx2)}
.m .tx a{color:var(--cy)}
.m .tx .mn{background:rgba(139,92,255,.22);color:#c9b8ff;border-radius:5px;padding:0 4px;font-weight:600}
.m .tx .spl{background:var(--bg0);color:transparent;border-radius:4px;cursor:pointer;padding:0 3px}
.m .tx .spl.show{background:var(--bg4);color:inherit}
.m img.att{max-width:min(400px,100%);max-height:340px;border-radius:14px;margin-top:6px;display:block;cursor:zoom-in}
.m .reply{font-size:12.5px;color:var(--tx3);display:flex;gap:6px;align-items:center;margin-bottom:3px;cursor:pointer;overflow:hidden;white-space:nowrap}
.m .reply b{color:var(--tx2);font-weight:600}.m .reply .av{width:16px;height:16px;font-size:8px;margin:0}
.sysm{display:flex;gap:14px;padding:4px 22px;color:var(--tx3);font-size:13.5px;align-items:center;margin-top:8px}
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rc{background:var(--bg3);border:1px solid transparent;border-radius:10px;padding:3px 9px;font-size:13.5px;display:flex;gap:5px;align-items:center;font-weight:600;color:var(--tx2);transition:transform .1s}
.rc:active{transform:scale(.92)}
.rc.mine{background:var(--acs);border-color:var(--ac);color:#ffd0e4}
.rc:hover{border-color:var(--bg5)}
.tools{position:absolute;right:18px;top:-18px;background:var(--bg1);border:1px solid var(--line);border-radius:12px;display:none;box-shadow:0 8px 24px rgba(5,3,15,.5);z-index:3;overflow:hidden;padding:2px}
.m:hover .tools,.m.tap .tools{display:flex}
.tools button{width:34px;height:32px;color:var(--tx2);display:grid;place-items:center;border-radius:8px}
.tools button svg{width:17px;height:17px}
.tools button:hover{background:var(--bg3);color:var(--tx)}
.tools button.del:hover{color:var(--red)}

/* ---------- caixa de mensagem ---------- */
#comp{padding:0 18px 16px;padding-bottom:calc(14px + var(--sab));position:relative}
#typing{height:22px;font-size:12px;color:var(--tx2);padding:2px 6px;display:flex;align-items:center;gap:6px}
#typing .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin-right:2px;animation:bo 1.2s infinite}
#typing .dots span:nth-child(2){animation-delay:.15s;background:var(--vi)}#typing .dots span:nth-child(3){animation-delay:.3s;background:var(--cy)}
@keyframes bo{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
#replyBar{background:var(--bg1);border-radius:14px 14px 0 0;padding:8px 14px;font-size:13px;color:var(--tx2);display:none;justify-content:space-between;align-items:center;border:1px solid var(--line);border-bottom:0}
#replyBar.on{display:flex}
#prev{display:none;padding:10px;background:var(--bg3);border-radius:14px 14px 0 0;border-bottom:1px solid var(--line);gap:10px;align-items:flex-end}
#prev.on{display:flex}
#prev img{max-height:120px;border-radius:10px}
#box{display:flex;align-items:flex-end;background:var(--bg3);border-radius:16px;padding:5px;border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
#box:focus-within{border-color:rgba(255,79,154,.5);box-shadow:0 0 0 4px rgba(255,79,154,.08)}
#replyBar.on~#box,#prev.on~#box{border-radius:0 0 16px 16px}
#inp{flex:1;background:none;border:0;outline:none;resize:none;padding:10px 6px;max-height:200px;line-height:1.4;min-height:40px}
#inp:focus-visible{outline:none}
#inp::placeholder{color:var(--tx3)}
#sendBtn{background:var(--grad);color:#fff !important;border-radius:12px}
#sendBtn:hover{filter:brightness(1.1)}
#hint{font-size:11px;color:var(--tx3);padding:5px 6px 0}

/* ---------- membros ---------- */
#mem{width:250px;background:var(--bg1);overflow-y:auto;padding:12px 10px;flex-shrink:0;border-left:1px solid var(--line)}
#mem.hide{display:none}
.mg{font-size:13px;color:var(--tx3);font-weight:600;padding:14px 8px 6px}
.mr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.mr:hover{background:rgba(255,255,255,.04)}
.mr.off{opacity:.45}
.mr .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mr .sub{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crown{font-size:12px}

/* ---------- painel lateral ---------- */
#panel{width:350px;background:var(--bg1);border-left:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0}
#panel.on{display:flex}
#panel .ph{padding:14px 16px;font-family:var(--disp);font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
#panel .pb{overflow-y:auto;flex:1;padding:8px 0}
#panel .m{padding:6px 14px}

/* ---------- chamada de voz e vídeo ---------- */
#call{flex:1;display:none;flex-direction:column;min-height:0;position:relative;background:
  radial-gradient(60% 50% at 15% 10%,rgba(255,79,154,.18),transparent 70%),
  radial-gradient(55% 50% at 90% 90%,rgba(77,225,255,.14),transparent 70%),
  radial-gradient(50% 60% at 70% 20%,rgba(139,92,255,.16),transparent 70%),#08061a}
#call.on{display:flex}
#grid{flex:1;display:grid;gap:12px;padding:16px;min-height:0;align-content:center;justify-content:center}
#grid.focus{grid-template-columns:1fr !important;grid-template-rows:1fr auto}
.tile{position:relative;background:rgba(36,31,64,.75);border-radius:20px;overflow:hidden;display:grid;place-items:center;aspect-ratio:16/9;min-width:0;min-height:0;cursor:pointer;transition:box-shadow .15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tile.speak{box-shadow:0 0 0 3px var(--green),0 0 30px rgba(62,224,143,.35)}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile.scr video{object-fit:contain}
.tile.self video.mirror{transform:scaleX(-1)}
.tile .av{width:92px;height:92px;font-size:36px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tile.speak .av{box-shadow:0 0 0 4px rgba(62,224,143,.35),0 0 0 8px rgba(62,224,143,.15)}
.tile .lbl{position:absolute;left:12px;bottom:12px;background:rgba(10,8,25,.65);backdrop-filter:blur(8px);padding:5px 11px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:600;max-width:calc(100% - 24px)}
.tile .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .lbl svg{width:14px;height:14px;color:var(--red)}
.tile .fs{position:absolute;right:10px;top:10px;background:rgba(10,8,25,.6);border-radius:10px;width:36px;height:36px;display:none;place-items:center}
.tile:hover .fs{display:grid}
#strip{display:none;gap:10px;overflow-x:auto;padding:0 16px 8px}
#grid.focus+#strip{display:flex}
#strip .tile{width:180px;flex-shrink:0}
#strip .tile .av{width:48px;height:48px;font-size:20px}
#ctrl{display:flex;justify-content:center;gap:10px;margin:0 auto calc(16px + var(--sab));padding:10px;flex-wrap:wrap;background:rgba(20,17,39,.75);backdrop-filter:blur(14px);border-radius:24px;border:1px solid var(--line)}
#ctrl:empty{display:none}
.cb{width:52px;height:52px;border-radius:17px;background:var(--bg3);display:grid;place-items:center;color:var(--tx);transition:background .15s,transform .1s}
.cb:hover{background:var(--bg4)}.cb:active{transform:scale(.93)}
.cb.on{background:#fff;color:#1a1631}
.cb.bad{background:var(--red);color:#fff}

const ico=n=>({

 mic:'<svg class="i" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>',
 micoff:'<svg class="i" viewBox="0 0 24 24"><path d="m1 1 22 22M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V4a3 3 0 0 0-5.9-.6"/><path d="M17 16.9A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.1 1.2M12 19v4M8 23h8"/></svg>',

 headoff:'<svg class="i" viewBox="0 0 24 24"><path d="m1 1 22 22M3 18v-6a9 9 0 0 1 14.5-7.1M21 12v6"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>',
 cam:'<svg class="i" viewBox="0 0 24 24"><path d="m23 7-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',

 screen:'<svg class="i" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v6"/></svg>',
 hang:'<svg class="i" viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8M23 1 1 23"/></svg>',
 full:'<svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>',
 reply:'<svg class="i" viewBox="0 0 24 24"><path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>',
 smile:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>',
 pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 17v5M9 10.8V4h6v6.8l3 3.2v2H6v-2z"/></svg>',
 edit:'<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
 link:'<svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
 out:'<svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
 chat:'<svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>',
 join:'<svg class="i" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
 bell:'<svg class="i" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
})[n]||'';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)}
function colorFor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length]}
const fmtTime=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function fmtDay(ts){const d=new Date(ts),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return 'Hoje';if(d.toDateString()===y.toDateString())return 'Ontem';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}
const ls={get(k,d){try{const v=localStorage.getItem('nexo2:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nexo2:'+k,JSON.stringify(v))}catch(e){}}};
const idb=(()=>{let p;const open=()=>p??=new Promise((res,rej)=>{const r=indexedDB.open('nexo2',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return{async get(k){try{const db=await open();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)})}catch(e){return undefined}},
    async set(k,v){try{const db=await open();await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}}})();

/* ---------------- estado ---------------- */
let ME=ls.get('me',null);
let DATA={servers:{},dms:{}};       // servers[code]={code,meta,channels,msgs,members,read}; dms[userId]={msgs,read}
const V={srv:null,ch:null,dm:null}; // o que está aberto
const UI={reply:null,editing:null,img:null,panel:null,query:'',showMem:ls.get('mem',innerWidth>900),focus:null,typing:{}};
const ROOMS={};                     // code -> {room,A,peers:{peerId:userId}}
const VOICE={};                     // code -> {userId:{ch,mute,deaf,cam,screen,peer}}
let CALL=null;                      // {srv,ch,mic,cam,screen,mute,deaf}
const REMOTE={};                    // peerId -> {mic,cam,screen}
let joinRoomFn=null,netOK=false;

let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  for(const s of Object.values(DATA.servers))for(const ch in s.msgs){const ids=Object.keys(s.msgs[ch]);if(ids.length>600){ids.sort((a,b)=>s.msgs[ch][a].ts-s.msgs[ch][b].ts).slice(0,ids.length-600).forEach(i=>delete s.msgs[ch][i])}}
  idb.set('data',DATA)},500)}

const srv=()=>DATA.servers[V.srv];
const chan=()=>srv()?.channels[V.ch];
const profile=()=>({id:ME.id,name:ME.name,color:ME.color,about:ME.about||'',status:ME.status||'online',avatar:ME.avatar||'',ai:!!(ls.get('ai-key','')&&ls.get('ai-share',true)),v:ME.v||1});
const BOTS={'bot:ia':{id:'bot:ia',name:'Nexo IA',color:'#8b5cff',emoji:'✨',about:'Sou a IA do Nexo. Me chame com @IA seguido da sua pergunta.'},'bot:dj':{id:'bot:dj',name:'DJ Nexo',color:'#ff4f9a',emoji:'🎧',about:'Toco música para o servidor inteiro. Use /tocar e um link do YouTube.'}};
const isBot=u=>String(u).startsWith('bot:');
function member(u){if(BOTS[u])return BOTS[u];if(u===ME.id)return profile();for(const s of Object.values(DATA.servers))if(s.members[u])return s.members[u];return null}
const nameOf=u=>member(u)?.name||'Alguém';
const colorOf=u=>member(u)?.color||colorFor(u);
function onlineUsers(code){const r=ROOMS[code];return new Set(r?Object.values(r.peers):[])}
function isOnline(u){if(u===ME.id)return true;return Object.values(ROOMS).some(r=>Object.values(r.peers).includes(u))}
function statusOf(u){const m=member(u);if(u===ME.id)return ME.status==='invisivel'?'offline':(ME.status||'online');
  if(!isOnline(u)||!m||m.status==='invisivel')return 'offline';return m.status||'online'}
function avatar(u,size,st,cls=''){const m=member(u);const n=m?.name||'?';
  if(m?.emoji)return `<div class="av bot ${cls}" data-user="${esc(u)}" style="background:${m.color};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.5)}px`:''}">${m.emoji}</div>`;
  const bg=m?.avatar?`background-image:url(${m.avatar});`:`background-color:${colorOf(u)};`;
  return `<div class="av ${cls}" data-av="${esc(u)}" style="${bg}${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px`:''}" data-user="${esc(u)}">${m?.avatar?'':esc((n[0]||'?').toUpperCase())}${st?`<span class="st ${statusOf(u)}"></span>`:''}</div>`}

/* ---------------- rede (Trystero) ---------------- */
async function loadNet(){
  try{const mod=await import('https://esm.run/trystero@0.21.6');joinRoomFn=mod.joinRoom;netOK=true;banner('')}
  catch(e){console.error(e);banner('Não consegui carregar a conexão. Verifique sua internet e recarregue a página.',true)}}
function banner(t,red){const b=$('#banner');b.textContent=t;b.classList.toggle('on',!!t);b.classList.toggle('red',!!red)}
const ACTIONS=['hello','sync','msg','chan','meta','typing','vstate','dm','react','bye','game','music'];
function connect(code){if(!joinRoomFn||ROOMS[code])return;
  const room=joinRoomFn({appId:APP_ID,password:'nx-'+code,turnConfig:TURN},'srv-'+code,err=>{console.warn(err);toast('Problema ao conectar ao servidor')});
  const A={};const R={room,A,peers:{}};ROOMS[code]=R;
  for(const n of ACTIONS){const[s,g]=room.makeAction(n);A[n]=s;g((d,p)=>{try{handle(code,n,d,p)}catch(e){console.warn(n,e)}})}
  room.onPeerJoin(p=>greet(code,p));
  room.onPeerLeave(p=>{const u=R.peers[p];delete R.peers[p];dropRemote(p);
    if(u&&VOICE[code]?.[u]?.peer===p){delete VOICE[code][u];if(CALL&&CALL.srv===code)sfx('leave')}renderAll()});
  room.onPeerStream((stream,p,meta)=>onStream(code,stream,p,meta));
}
function greet(code,p){const R=ROOMS[code];if(!R)return;
  R.A.hello({u:profile()},p);R.A.sync(syncPayload(code),p);
  if(CALL&&CALL.srv===code)R.A.vstate(myV(),p)}
function broadcast(code,n,d,target){const R=ROOMS[code];if(R)R.A[n](d,target??null)}
function syncPayload(code){const s=DATA.servers[code];const msgs={};
  for(const ch in s.msgs){msgs[ch]=Object.values(s.msgs[ch]).sort((a,b)=>b.ts-a.ts).slice(0,120)}
  const games=Object.values(s.games||{}).sort((a,b)=>b.ts-a.ts).slice(0,40);
  return{meta:s.meta,channels:s.channels,msgs,games,music:s.music||null,members:Object.fromEntries(Object.entries(s.members).filter(([k])=>k!==ME.id))}}

function mergeMsg(s,m){if(!m||!m.id||!m.ch)return false;s.msgs[m.ch]??={};const cur=s.msgs[m.ch][m.id];
  if(!cur){s.msgs[m.ch][m.id]=m;return 'new'}
  let ch=false;if((m.v||0)>(cur.v||0)){const r=cur.reactions;Object.assign(cur,m);cur.reactions=r;ch=true}
  for(const e in m.reactions||{})for(const u in m.reactions[e]){cur.reactions??={};cur.reactions[e]??={};const a=cur.reactions[e][u],b=m.reactions[e][u];if(!a||b.t>a.t){cur.reactions[e][u]=b;ch=true}}
  return ch}
function acceptMeta(s,d,from){if(!d||(d.v||0)<=(s.meta.v||0))return false;
  // só o dono pode mudar quem é o dono ou a lista de expulsos
  if(s.meta.owner&&from!==s.meta.owner)d={...d,owner:s.meta.owner,kicked:s.meta.kicked||{}};
  s.meta=d;for(const u in d.kicked||{})delete s.members[u];return true}
function mergeServerState(code,d,from){const s=DATA.servers[code];let ch=false;
  if(d.meta&&acceptMeta(s,d.meta,from))ch=true;
  for(const g of d.games||[])if(mergeGame(s,g))ch=true;
  if(d.music&&(d.music.v||0)>(s.music?.v||0)){s.music=d.music;ch=true;if(code===UI.listenSrv)musicApply();else if(d.music.playing)autoListen(code)}
  for(const id in d.channels||{}){const c=d.channels[id];if(!s.channels[id]||(c.v||0)>(s.channels[id].v||0)){s.channels[id]=c;ch=true}}
  for(const u in d.members||{}){if(u===ME.id||s.meta.kicked?.[u])continue;const m=d.members[u];if(!s.members[u]||(m.v||0)>(s.members[u].v||0)){s.members[u]=m;ch=true}}
  for(const c in d.msgs||{})for(const m of d.msgs[c]||[])if(mergeMsg(s,m))ch=true;
  return ch}

function handle(code,n,d,p){const s=DATA.servers[code];if(!s)return;const R=ROOMS[code];
  const su=R.peers[p];if(su&&s.meta.kicked?.[su]&&n!=='hello')return; // ignora quem foi expulso
  switch(n){
  case'hello':{if(!d?.u?.id)return;if(s.meta.kicked?.[d.u.id]){R.peers[p]=d.u.id;R.A.meta(s.meta,p);return}
    const first=!R.peers[p];R.peers[p]=d.u.id;const old=s.members[d.u.id];
    if(!old||(d.u.v||0)>=(old.v||0))s.members[d.u.id]={...d.u,seen:Date.now()};
    if(first){const box=DATA.dms[d.u.id];if(box){const mine=Object.values(box.msgs).filter(m=>m.author===ME.id).sort((a,b)=>b.ts-a.ts).slice(0,100);if(mine.length)mine.forEach(m=>R.A.dm(m,p))}}
    save();renderAll();break}
  case'sync':{if(mergeServerState(code,d,su)){save();if(checkKicked(code))return;if(V.srv===code){ensureCh();renderAll();renderMsgs(true);markRead()}else renderRail()}break}
  case'msg':{const r=mergeMsg(s,d);if(!r)return;save();
    if(r==='new'&&d.author!==ME.id){d._new=true;notify(code,d);maybeAnswerAI(code,d)}
    if(V.srv===code&&V.ch===d.ch){const nb=nearBottom();renderMsgs(nb);markRead()}else renderSide(),renderRail();
    delete UI.typing[d.author];renderTyping();break}
  case'chan':{if(!d?.id)return;const c=s.channels[d.id];if(!c||(d.v||0)>(c.v||0)){s.channels[d.id]=d;save();if(V.srv===code){const had=V.ch;ensureCh();if(had!==V.ch)renderMsgs(true)}renderAll()}break}
  case'meta':{if(acceptMeta(s,d,su)){save();if(checkKicked(code))return;renderAll();if(V.srv===code)renderMsgs(nearBottom())}break}
  case'music':{if((d?.v||0)>(s.music?.v||0)){s.music=d;save();if(code===UI.listenSrv)musicApply();else if(d.playing)autoListen(code);if(V.srv===code&&UI.panel==='music')renderPanel();renderVBar();renderMusicBar()}break}
  case'game':{if(mergeGame(s,d)){save();if(V.srv===code&&V.ch===d.ch)renderMsgs(nearBottom())}break}
  case'typing':{if(V.srv!==code||d.ch!==V.ch)return;UI.typing[d.u]=Date.now();renderTyping();break}
  case'react':{const m=s.msgs[d.ch]?.[d.mid];if(!m)return;m.reactions??={};m.reactions[d.e]??={};const a=m.reactions[d.e][d.u];
    if(!a||d.t>a.t){m.reactions[d.e][d.u]={on:d.on,t:d.t};save();if(V.srv===code&&V.ch===d.ch)renderMsgs(nearBottom())}break}
  case'vstate':{const u=R.peers[p]||d.u;if(!u)return;if(!R.peers[p])R.peers[p]=u;onVState(code,u,p,d);break}
  case'dm':{const from=R.peers[p];if(!from||!d?.id)return;const box=DATA.dms[from]??={msgs:{},read:0};
    if(d.del){delete box.msgs[d.id]}else{const cur=box.msgs[d.id];if(cur&&(cur.v||0)>=(d.v||0))return;const isNew=!cur;box.msgs[d.id]={...d,author:d.author===ME.id?ME.id:from};
      if(isNew&&d.author!==ME.id)notify(null,{...d,author:from,dm:true})}
    save();if(V.dm===from){renderMsgs(nearBottom());markRead()}else renderAll();break}
  case'bye':{const u=R.peers[p];if(u)delete s.members[u];save();renderAll();break}
  }}
function sendDM(to,msg){let sent=false;for(const code in ROOMS){const R=ROOMS[code];const ps=Object.entries(R.peers).filter(([,u])=>u===to).map(([p])=>p);
  if(ps.length){R.A.dm(msg,ps);sent=true;break}}return sent}

/* ---------------- expulsar ---------------- */
const isOwner=(code=V.srv)=>DATA.servers[code]?.meta.owner===ME.id;
function checkKicked(code){const s=DATA.servers[code];if(!s?.meta.kicked?.[ME.id])return false;const name=s.meta.name;
  leaveServer(code,true);modal(`<h3>Você foi expulso</h3><p class="sub">O dono do servidor <b>${esc(name)}</b> tirou você de lá.</p><div class="row"><button class="btn" data-close>Ok</button></div>`);return true}
function kickUser(u){const s=srv();if(!s||!isOwner()||u===ME.id)return;s.kickedNames??={};s.kickedNames[u]=nameOf(u);
  s.meta={...s.meta,kicked:{...(s.meta.kicked||{}),[u]:Date.now()},v:Date.now()};delete s.members[u];
  if(VOICE[s.code]?.[u]){const pr=VOICE[s.code][u].peer;delete VOICE[s.code][u];dropRemote(pr)}
  broadcast(s.code,'meta',s.meta);save();renderAll();renderMsgs(false);toast(`${nameOf(u)} foi expulso do servidor`)}
function unkickUser(u){const s=srv();if(!s||!isOwner())return;const k={...(s.meta.kicked||{})};delete k[u];
  s.meta={...s.meta,kicked:k,v:Date.now()};broadcast(s.code,'meta',s.meta);save();toast('Pronto, essa pessoa pode entrar de novo pelo convite')}
function kickModal(u){const s=srv();modal(`<h3>Expulsar ${esc(nameOf(u))}?</h3><p class="sub">${esc(nameOf(u))} vai sair de <b>${esc(s.meta.name)}</b> e não vai conseguir entrar de novo, nem pelo convite, até você desfazer nas configurações do servidor.</p>
  <div class="row"><button class="btn g" data-close>Cancelar</button><button class="btn r" id="kk">Expulsar</button></div>`,md=>md.querySelector('#kk').onclick=()=>{closeModal();kickUser(u)})}

/* ---------------- servidores ---------------- */
function newServerObj(code,name,icon,color){return{code,meta:{name,icon,color,owner:ME.id,v:Date.now(),created:Date.now()},channels:{},msgs:{},members:{},read:{}}}
function createServer(name,icon,color){const code=uid(10);const s=newServerObj(code,name,icon,color);const t=Date.now();
  [['geral','text'],['memes','text'],['jogos','text'],['Sala de voz','voice'],['Jogando juntos','voice']].forEach(([n,ty],i)=>{const id=uid(8);s.channels[id]={id,name:n,type:ty,order:i,topic:i===0?'Papo livre — sejam bem-vindos!':'',v:t}});
  DATA.servers[code]=s;save();connect(code);openServer(code);setTimeout(()=>inviteModal(),300)}
function joinServer(code){code=String(code).trim();const m=code.match(/entrar=([a-z0-9]+)/i);if(m)code=m[1];code=code.replace(/[^a-z0-9]/gi,'').toLowerCase();
  if(code.length<6){toast('Código de convite inválido');return}
  if(!DATA.servers[code]){const s=newServerObj(code,'Entrando…','⏳','#5b6472');s.meta.v=0;s.meta.owner='';DATA.servers[code]=s;save();
    toast('Procurando o servidor… alguém que já está nele precisa estar online.')}
  connect(code);openServer(code)}
function leaveServer(code,quiet){if(CALL?.srv===code)leaveCall();if(!quiet)broadcast(code,'bye',{});const R=ROOMS[code];setTimeout(()=>{try{R?.room.leave()}catch(e){}},300);delete ROOMS[code];
  delete DATA.servers[code];delete VOICE[code];save();if(V.srv===code||!quiet)openHome();else renderAll()}
function ensureCh(){const s=srv();if(!s)return;const c=s.channels[V.ch];if(!c||c.deleted)V.ch=sortedChans('text')[0]?.id||null}
function sortedChans(type){const s=srv();if(!s)return[];return Object.values(s.channels).filter(c=>!c.deleted&&(c.type||'text')===type).sort((a,b)=>(a.order||0)-(b.order||0))}
function unreadCount(s,ch){const r=s.read?.[ch]||0;let n=0;for(const m of Object.values(s.msgs[ch]||{}))if(m.ts>r&&m.author!==ME.id&&!m.deleted)n++;return n}
function serverUnread(s){return Object.values(s.channels).some(c=>!c.deleted&&c.type!=='voice'&&unreadCount(s,c.id)>0)}
function mentionCount(s){let n=0;for(const c of Object.values(s.channels)){if(c.deleted)continue;const r=s.read?.[c.id]||0;for(const m of Object.values(s.msgs[c.id]||{}))if(m.ts>r&&mentionsMe(m))n++}return n}
function dmUnread(u){const b=DATA.dms[u];if(!b)return 0;return Object.values(b.msgs).filter(m=>m.ts>(b.read||0)&&m.author!==ME.id).length}

  el.innerHTML=h}

/* ---- mensagens ---- */
function curMsgs(){if(V.dm)return Object.values(DATA.dms[V.dm]?.msgs||{}).sort((a,b)=>a.ts-b.ts);
  if(!V.srv||!V.ch)return[];return Object.values(srv().msgs[V.ch]||{}).filter(m=>!m.deleted).sort((a,b)=>a.ts-b.ts)}
function fmt(text){let t=esc(text);const blocks=[];
  t=t.replace(/```(?:\w+\n)?([\s\S]*?)```/g,(_,c)=>{blocks.push(c.replace(/^\n/,''));return `\u0000${blocks.length-1}\u0000`});
  t=t.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
   .replace(/`([^`\n]+)`/g,'<code>$1</code>')
   .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<u>$1</u>')
   .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>')
   .replace(/\|\|([^|\n]+)\|\|/g,'<span class="spl">$1</span>')
   .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
   .replace(/(^|\s)@([\wÀ-ÿ.\-]+)/g,'$1<span class="mn">@$2</span>');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`)}
const onlyEmoji=t=>t&&t.length<=12&&/^(\p{Extended_Pictographic}|‍|️|\s)+$/u.test(t);
function mentionsMe(m){if(m.author===ME.id)return false;const t=(m.text||'').toLowerCase();const n=(ME.name||'').toLowerCase().split(' ')[0];return (n&&t.includes('@'+n))||t.includes('@todos')||t.includes('@everyone')}
function reactList(m){const out=[];for(const e in m.reactions||{}){const us=Object.entries(m.reactions[e]).filter(([,v])=>v.on).map(([u])=>u);if(us.length)out.push([e,us])}return out}
function msgHTML(m,first,compact){const mine=m.author===ME.id;
  const tools=compact?'':`<div class="tools">${V.dm?'':QUICK.slice(0,3).map(e=>`<button data-rq="${esc(m.id)}" data-e="${e}" title="Reagir ${e}" style="font-size:16px">${e}</button>`).join('')}${V.dm?'':`<button data-react="${esc(m.id)}" title="Mais reações">${ico('smile')}</button>`}<button data-reply="${esc(m.id)}" title="Responder">${ico('reply')}</button>${V.dm?'':`<button data-pin="${esc(m.id)}" title="${m.pinned?'Desafixar':'Fixar'}">${ico('pin')}</button>`}${mine?`<button data-edit="${esc(m.id)}" title="Editar">${ico('edit')}</button><button class="del" data-del="${esc(m.id)}" title="Apagar">${ico('trash')}</button>`:''}</div>`;
  const body=UI.editing===m.id?`<textarea data-editbox="${esc(m.id)}" style="width:100%;background:var(--bg0);border:1px solid var(--ac);border-radius:8px;padding:9px;outline:none;resize:vertical;margin-top:2px" rows="2">${esc(m.text)}</textarea><div style="font-size:11.5px;color:var(--tx3)">Enter para salvar · Esc para cancelar</div>`
    :`${m.text?`<div class="tx ${onlyEmoji(m.text)?'big':''}">${fmt(m.text)}${m.edited?' <span class="ed">(editado)</span>':''}</div>`:''}${m.img?`<img class="att" src="${esc(m.img)}" alt="imagem enviada">`:''}${m.game?gameHTML(m.game):''}${m.call?`<button class="btn" style="margin-top:8px;display:inline-flex;gap:8px;align-items:center" data-callx="${esc(m.call.code)}|${esc(m.call.ch)}">${ico('vol')} Entrar na chamada</button>`:''}`;
  const reply=m.replyTo?`<div class="reply" data-jump="${esc(m.replyTo.id)}">↱ ${avatar(m.replyTo.author,16)}<b>${esc(nameOf(m.replyTo.author))}</b> ${esc((m.replyTo.text||'🖼️ imagem').slice(0,90))}</div>`:'';
  const rs=reactList(m);const head=first||compact;
  return `<div class="m ${head?'first':''} ${mentionsMe(m)?'mention':''}" id="m-${esc(m.id)}">${tools}
    ${head?avatar(m.author):`<div class="gut">${fmtTime(m.ts)}</div>`}
    <div class="c">${reply}${head?`<div class="h"><span class="a" data-user="${esc(m.author)}" style="color:${colorOf(m.author)}">${esc(nameOf(m.author))}</span>${isBot(m.author)?'<span class="bottag">BOT</span>':''}<span class="tm">${fmtDay(m.ts)} às ${fmtTime(m.ts)}</span>${m.pinned?`<span style="color:var(--yel);font-size:11px">📌 fixada</span>`:''}</div>`:''}
    ${body}${rs.length?`<div class="reacts">${rs.map(([e,us])=>`<button class="rc ${us.includes(ME.id)?'mine':''}" data-rq="${esc(m.id)}" data-e="${esc(e)}" title="${esc(us.map(nameOf).join(', '))}">${e} <span>${us.length}</span></button>`).join('')}<button class="rc" data-react="${esc(m.id)}" title="Adicionar reação">${ico('smile').replace('class="i"','class="i" style="width:15px;height:15px"')}</button></div>`:''}</div></div>`}
function nearBottom(){const e=$('#msgs');return e.scrollHeight-e.scrollTop-e.clientHeight<150}
function renderMsgs(stick=true){const e=$('#msgs');if(!V.dm&&(!V.srv||!V.ch||chan()?.type==='voice')){if(V.srv&&!V.ch)e.innerHTML=`<div class="welcome"><div class="big">${ico('hash')}</div><h2>Nenhum canal</h2><p>Crie um canal de texto com o ＋ na lateral.</p></div>`;renderPanel();return}
  let h='';
  if(V.dm){h+=`<div class="welcome">${avatar(V.dm,80)}<h2 style="margin-top:14px">${esc(nameOf(V.dm))}</h2><p>Este é o começo da sua conversa direta com <b>${esc(nameOf(V.dm))}</b>. As mensagens chegam quando vocês dois estão online.</p></div>`}
  else{const c=chan();h+=`<div class="welcome"><div class="big">${ico('hash')}</div><h2>Bem-vindo a #${esc(c.name)}!</h2><p>Este é o começo do canal #${esc(c.name)}.${c.topic?' '+esc(c.topic):''}</p></div>`}
  let prev=null,pd='';
  for(const m of curMsgs()){const day=new Date(m.ts).toDateString();if(day!==pd){h+=`<div class="daysep">${fmtDay(m.ts)}</div>`;pd=day;prev=null}
    const first=!prev||prev.author!==m.author||m.ts-prev.ts>7*60e3||m.replyTo;h+=msgHTML(m,first);prev=m}
  e.innerHTML=h;if(stick)e.scrollTop=e.scrollHeight;
  const eb=e.querySelector('[data-editbox]');if(eb){eb.focus();eb.setSelectionRange(eb.value.length,eb.value.length)}
  renderPanel()}
function renderPanel(){const p=$('#panel');p.classList.toggle('on',!!UI.panel);if(!UI.panel)return;

function shuffle(a){const r=crypto.getRandomValues(new Uint32Array(a.length));for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function unoDrawN(U,u,n){for(let k=0;k<n;k++){if(!U.deck.length){const top=U.discard.pop();U.deck=shuffle(U.discard.map(c=>c));U.discard=[top]}if(!U.deck.length)break;U.hands[u].push(U.deck.pop())}}

const UNO_CN={r:'vermelho',g:'verde',b:'azul',y:'amarelo'};

function unoPlay(id,i,chosen){const g=getGame(id);if(!g?.uno?.started||g.winner||g.players[g.turn]!==ME.id)return;const U=g.uno;const c=U.hands[ME.id][i];if(!c||!unoCanPlay(g,c))return;
  if(c[0]==='w'&&!chosen)return;U.hands[ME.id].splice(i,1);U.discard.push(c);if(U.discard.length>30)U.discard=U.discard.slice(-30);U.color=c[0]==='w'?chosen:c[0];

function gameMove(id,i){const g=getGame(id);if(!g||g.winner||g.players.length<2||g.players[g.turn]!==ME.id)return;const mark=g.turn+1;

  if(g.type==='lig4'){const col=i%7;let idx=-1;for(let r=5;r>=0;r--)if(!g.board[r*7+col]){idx=r*7+col;break}if(idx<0)return;g.board[idx]=mark;g.lastIdx=idx;

  const a=ac();a?.resume?.();const an=a.createAnalyser();an.fftSize=512;a.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);
  micTest={stream:st,raf:0,loop:null};
  if(hear){const el=new Audio();el.srcObject=st;applySink(el);el.play().catch(()=>{});micTest.loop=el}
  const bar=md.querySelector('#lvl');const tick=()=>{an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}const r=Math.min(1,Math.sqrt(s/buf.length)*4);

  const t=a.currentTime;[523,659,784].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.18));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.setValueAtTime(.25,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  const el=new Audio();el.srcObject=dst.stream;el.volume=ls.get('outvol',100)/100>1?1:ls.get('outvol',100)/100;applySink(el);await el.play().catch(()=>{});o.start(t);o.stop(t+.65);setTimeout(()=>el.pause(),900)}

  for(const u of now)if(!speaking.has(u))changed=true;for(const u of speaking)if(!now.has(u))changed=true;
  if(changed){speaking.clear();now.forEach(u=>speaking.add(u));document.querySelectorAll('[data-tu]').forEach(t=>t.classList.toggle('speak',speaking.has(t.dataset.tu)));

function compress(file,max=1280,q=.82,limit=350000,square){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const cv=document.createElement('canvas');let out;
  for(let k=0;k<7;k++){let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m}
    const s=Math.min(1,max/Math.max(w,h));cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
    out=cv.toDataURL('image/jpeg',q);if(out.length<limit)break;max*=.8;q-=.07}
  out.length<limit*1.3?res(out):rej()};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  else if(d.jump){const el=document.getElementById('m-'+d.jump);if(el){if(innerWidth<=900){UI.panel=null;renderPanel();renderTop()}el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}else toast('Mensagem não encontrada')}
  else if('close' in d)closeModal();
  else if('joincall' in d)joinCall(V.srv,V.ch,d.joincall==='cam');
  else if('mute' in d){if(CALL)toggleMute();else toast('Você não está em uma chamada')}
  else if('deaf' in d){if(CALL)toggleDeaf();else toast('Você não está em uma chamada')}
  else if('cam' in d)toggleCam();
  else if('screen' in d)toggleScreen();
  else if('flip' in d)switchCam();
  else if('leave' in d)leaveCall();
  else if('install' in d){closeModal();installApp()}
  else if(d.mus){const code=d.msrv||V.srv;({play:()=>musicResume(code),pause:()=>musicPause(code),skip:()=>musicSkip(code),stop:()=>musicStop(code),prev:()=>musicSeek(0,code),listen:()=>musicListen(code,true),mute:()=>musicListen(code,false)})[d.mus]?.()}
  else if(d.mrm)musicRemove(d.mrm);
  else if('gomusic' in d){if(UI.listenSrv&&DATA.servers[UI.listenSrv]){openServer(UI.listenSrv);UI.panel='music';renderPanel();renderTop()}}
  else if(d.unoc){const[g,i,c]=d.unoc.split('|');closePop();unoPlay(g,+i,c)}
  else if(d.uno){const[g,i]=d.uno.split('|');const G=getGame(g);const card=G?.uno?.hands[ME.id]?.[+i];if(card&&card[0]==='w'){const r=t.getBoundingClientRect();pop(`<div style="padding:4px"><b style="font-family:var(--disp)">Escolha a cor</b><div class="unocol">${['r','y','g','b'].map(c=>`<button data-unoc="${g}|${i}|${c}" class="c-${c}"></button>`).join('')}</div></div>`,r.left,r.top-110)}else unoPlay(g,+i)}
  else if(d.unod)unoDraw(d.unod);
  else if(d.unop)unoPass(d.unop);
  else if(d.unostart)unoStart(d.unostart);
  else if(d.kick){closePop();kickModal(d.kick)}
  else if('gamesbtn' in d){const r=t.getBoundingClientRect();gamesPop(r.left,r.top-250)}
  else if(d.gstart){closePop();startGame(d.gstart)}
  else if(d.gjoin)gameJoin(d.gjoin);
  else if(d.gmove){const[g,i]=d.gmove.split('|');gameMove(g,+i)}
  else if(d.gpick){const[g,c]=d.gpick.split('|');gamePick(g,c)}
  else if(d.grematch)gameRematch(d.grematch);
  else if('gocall' in d){V.srv=CALL.srv;openChannel(CALL.ch)}
  else if(d.callx){const[c,ch]=d.callx.split('|');if(!DATA.servers[c]?.channels[ch]){toast('Essa chamada não está mais disponível');return}joinCall(c,ch,false)}
  else if(d.m){closePop();({invite:inviteModal,set:serverSettings,ch:()=>newChannelModal('text'),leave:()=>{modal(`<h3>Sair de ${esc(srv().meta.name)}?</h3><p class="sub">Você pode voltar depois com um convite.</p><div class="row"><button class="btn g" data-close>Cancelar</button><button class="btn r" id="lv">Sair do servidor</button></div>`,md=>md.querySelector('#lv').onclick=()=>{closeModal();leaveServer(V.srv)})}})[d.m]()}
  else if(t.classList.contains('spl'))t.classList.toggle('show');
  else if(t.matches('img.att')){$('#zoomImg').src=t.src;$('#zoom').classList.add('on')}
});
$('#zoom').onclick=()=>$('#zoom').classList.remove('on');
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov'&&!$('#ov').dataset.lock)closeModal()});
$('#sideHead').onclick=e=>{e.stopPropagation();if(V.srv)serverMenu()};
$('#burger').onclick=()=>document.body.classList.toggle('nav');
$('#main').addEventListener('click',e=>{if(document.body.classList.contains('nav')&&innerWidth<=700&&!e.target.closest('#burger')){document.body.classList.remove('nav');e.stopPropagation();e.preventDefault()}},true);
$('#memBtn').onclick=()=>{UI.showMem=!UI.showMem;ls.set('mem',UI.showMem);renderMem();renderTop()};
$('#musicBtn').onclick=()=>{UI.panel=UI.panel==='music'?null:'music';renderPanel();renderTop()};
$('#pinsBtn').onclick=()=>{UI.panel=UI.panel==='pins'?null:'pins';renderPanel();renderTop()};
$('#inviteBtn').onclick=()=>inviteModal();
$('#callBtn').onclick=()=>dmCall(false);$('#vidBtn').onclick=()=>dmCall(true);
$('#panelX').onclick=()=>{UI.panel=null;renderPanel();renderTop()};
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){UI.query=e.target.value.trim();UI.panel=UI.query?'search':null;renderPanel();renderTop()}});
const inp=$('#inp');
inp.addEventListener('input',()=>{autoGrow();if(inp.value)typingPing()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(hover:none)').matches){e.preventDefault();send()}
  else if(e.key==='ArrowUp'&&!inp.value){const mine=[...curMsgs()].reverse().find(m=>m.author===ME.id&&m.text);if(mine){e.preventDefault();UI.editing=mine.id;renderMsgs(false)}}
  else if(e.key==='Escape'){UI.reply=null;updReply()}});
$('#sendBtn').onclick=send;
$('#replyX').onclick=()=>{UI.reply=null;updReply()};
$('#emoBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();emojiPop(r.right-310,r.top-320,em=>{inp.value+=em;inp.focus()})};
$('#attBtn').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{UI.img=await compress(f);updPrev()}catch(_){toast('Não consegui usar essa imagem')}};
$('#prevX').onclick=()=>{UI.img=null;updPrev()};
document.addEventListener('paste',async e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith('image/'));if(f&&(V.ch||V.dm)){e.preventDefault();try{UI.img=await compress(f);updPrev()}catch(_){}}});
$('#msgs').addEventListener('keydown',e=>{const b=e.target.closest('[data-editbox]');if(!b)return;
  if(e.key==='Escape'){UI.editing=null;renderMsgs(false)}
  else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const id=b.dataset.editbox,txt=b.value.trim();UI.editing=null;const m=getMsg(id);if(txt&&m&&txt!==m.text)updateMsg(id,{text:txt,edited:true});else renderMsgs(false)}});
$('#hint').innerHTML='<b>/ajuda</b> mostra os comandos · <b>/tocar</b> nome da música · <b>@IA</b> pergunta para a IA';
addEventListener('hashchange',()=>{const m=location.hash.match(/entrar=([a-z0-9]+)/i);if(m&&ME){joinServer(m[1]);history.replaceState(null,'',location.pathname)}});
addEventListener('beforeunload',()=>{if(CALL)broadcast(CALL.srv,'vstate',{u:ME.id,ch:null})});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(V.ch||V.dm)markRead()}});

/* ---- app instalável ---- */
let SWREG=null,installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker?.register('sw.js').then(r=>SWREG=r).catch(e=>console.warn('sw',e))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!V.srv&&!V.dm)renderMain()});
addEventListener('appinstalled',()=>{installEvt=null;toast('Nexo instalado! Procure o ícone na sua tela inicial.');renderMain()});
async function installApp(){
  if(installEvt){installEvt.prompt();const r=await installEvt.userChoice.catch(()=>null);installEvt=null;if(r?.outcome!=='accepted')toast('Instalação cancelada');return}
  if(location.protocol==='file:'){toast('Primeiro publique o Nexo num site (https) para poder instalar.');return}
  const ios=isIOS();
  modal(`<h3>Instalar o Nexo</h3><p class="sub">${ios?'No iPhone ou iPad, a instalação é feita pelo Safari:':'Seu navegador não mostrou o botão automático. Faça assim:'}</p>
  ${ios?`<div class="opt"><div style="font-size:24px">1</div><div><b>Abra este link no Safari</b><small>No Chrome do iPhone também funciona, pelo mesmo botão.</small></div></div>
  <div class="opt"><div style="font-size:24px">2</div><div><b>Toque em Compartilhar</b><small>O quadrado com a seta para cima, na barra do navegador.</small></div></div>
  <div class="opt"><div style="font-size:24px">3</div><div><b>Escolha "Adicionar à Tela de Início"</b><small>O ícone do Nexo aparece junto dos seus apps.</small></div></div>`
  :`<div class="opt"><div style="font-size:24px">1</div><div><b>Abra o menu do navegador</b><small>Os três pontinhos (⋮) no canto da tela.</small></div></div>
  <div class="opt"><div style="font-size:24px">2</div><div><b>Toque em "Instalar app" ou "Adicionar à tela inicial"</b><small>No computador, também aparece um ícone de instalar na barra de endereço.</small></div></div>`}
  <div class="row"><button class="btn" data-close>Entendi</button></div>`)}

/* ---- início ---- */
async function start(){
  const saved=await idb.get('data');if(saved&&saved.servers)DATA=saved;DATA.dms??={};
  for(const s of Object.values(DATA.servers)){s.read??={};s.members??={};s.msgs??={}}
  const v=ls.get('view',null);if(v){if(v.srv&&DATA.servers[v.srv]){V.srv=v.srv;V.ch=v.ch}else if(v.dm){V.dm=v.dm;DATA.dms[v.dm]??={msgs:{},read:0}}}
  if(V.srv){const c=DATA.servers[V.srv].channels[V.ch];if(!c||c.deleted||c.type==='voice')V.ch=Object.values(DATA.servers[V.srv].channels).filter(c=>!c.deleted&&c.type!=='voice').sort((a,b)=>a.order-b.order)[0]?.id||null}
  renderAll();renderMsgs(true);
  if(location.protocol==='file:')banner('Você abriu o Nexo como arquivo. Para chamadas e convites funcionarem, publique-o num site (https).');
  banner(location.protocol==='file:'?$('#banner').textContent:'Conectando…');
  await loadNet();loadCaps();
  if(location.protocol==='file:')banner('Você abriu o Nexo como arquivo. Para chamadas e convites funcionarem, publique-o num site (https).');
  for(const code in DATA.servers)connect(code);
  if(UI.listenSrv&&!DATA.servers[UI.listenSrv]){UI.listenSrv=null;ls.set('listen',null)}renderMusicBar();
  if(UI.listenSrv){const once=()=>{musicListen(UI.listenSrv,true);removeEventListener('pointerdown',once)};addEventListener('pointerdown',once)}
  const m=location.hash.match(/entrar=([a-z0-9]+)/i);if(m){joinServer(m[1]);history.replaceState(null,'',location.pathname)}
  renderAll();
  if(innerWidth<=700&&(V.ch||V.dm))document.body.classList.remove('nav');
}
if(!ME)onboarding();else start();
</script>
