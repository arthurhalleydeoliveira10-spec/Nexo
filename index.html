<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<title>Nexo — converse, fale e jogue com seus amigos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4f9a'/%3E%3Cstop offset='.55' stop-color='%238b5cff'/%3E%3Cstop offset='1' stop-color='%234de1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='20' fill='url(%23g)'/%3E%3Cpath d='M18 46V18h6l16 18V18h6v28h-6L24 28v18z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0c0a18;--bg1:#141127;--bg2:#1a1631;--bg3:#241f40;--bg4:#2f2952;--bg5:#3c3566;
  --tx:#f3f0ff;--tx2:#b5aed6;--tx3:#7c74a3;
  --ac:#ff4f9a;--ac2:#ec3a87;--acs:rgba(255,79,154,.15);--on-ac:#fff;--cy:#4de1ff;--vi:#8b5cff;
  --grad:linear-gradient(135deg,#ff4f9a 0%,#8b5cff 55%,#4de1ff 100%);
  --red:#ff5468;--yel:#ffc857;--blue:#6ec9ff;--green:#3ee08f;
  --line:rgba(190,175,255,.08);--mention:rgba(255,200,87,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --disp:'Bricolage Grotesque',Onest,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg0);color:var(--tx);font-family:Onest,system-ui,sans-serif;font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:var(--ac);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#app{display:flex;height:100%;padding-top:var(--sat)}

/* ---------- trilho de servidores ---------- */
#rail{width:76px;background:var(--bg0);display:flex;flex-direction:column;align-items:center;padding:14px 0 calc(14px + var(--sab));gap:10px;overflow-y:auto;flex-shrink:0;scrollbar-width:none}
.sv{width:50px;height:50px;border-radius:17px;background:var(--bg3);display:grid;place-items:center;font-size:22px;font-weight:700;font-family:var(--disp);transition:transform .15s,box-shadow .2s,border-radius .2s;position:relative;flex-shrink:0;color:#fff;overflow:visible;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sv:hover{transform:translateY(-1px);border-radius:14px}
.sv:active{transform:scale(.94)}
.sv.on{border-radius:14px;box-shadow:0 0 0 2px var(--bg0),0 0 0 4px var(--ac),0 6px 18px rgba(255,79,154,.35)}
.sv::before{content:"";position:absolute;left:-13px;width:5px;height:0;background:var(--grad);border-radius:0 5px 5px 0;transition:height .2s}
.sv.unread::before{height:8px}.sv:hover::before{height:20px}.sv.on::before{height:36px}
.sv .badge{position:absolute;bottom:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);border:3px solid var(--bg0);font-size:10px;font-family:Onest;display:grid;place-items:center;padding:0 3px;box-sizing:content-box}
.sv .vc{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--bg0);display:grid;place-items:center}
.sv .vc svg{width:10px;height:10px;stroke:#062b18;stroke-width:3}
.sv.add,.sv.join{color:var(--tx2);background:transparent;box-shadow:inset 0 0 0 1.5px var(--bg4)}
.sv.add:hover,.sv.join:hover{color:#fff;background:var(--grad);box-shadow:none}
.sep{width:28px;height:2px;background:var(--bg3);border-radius:2px;flex-shrink:0}

/* ---------- barra lateral ---------- */
#side{width:256px;background:var(--bg1);display:flex;flex-direction:column;flex-shrink:0;border-radius:18px 0 0 0}
#sideHead{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:17px;cursor:pointer;gap:8px;flex-shrink:0;border-radius:18px 0 0 0}
#sideHead:hover{background:rgba(255,255,255,.03)}
#sideHead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chans{flex:1;overflow-y:auto;padding:8px 10px}
.cat{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--tx3);padding:18px 6px 6px}
.cat button{color:var(--tx3);display:grid;width:24px;height:24px;place-items:center;border-radius:6px}.cat button:hover{color:var(--tx);background:var(--bg3)}
.cat svg.i{width:16px;height:16px}
.ch{position:relative;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;color:var(--tx3);cursor:pointer;margin-bottom:2px;min-height:38px;transition:background .12s,color .12s}
.ch svg.i{width:18px;height:18px}
.ch:hover{background:rgba(255,255,255,.04);color:var(--tx2)}
.ch.on{background:var(--bg3);color:var(--tx)}
.ch.on svg.i{color:var(--ac)}
.ch.unread{color:var(--tx);font-weight:600}
.ch.unread::before{content:"";position:absolute;left:-10px;width:4px;height:8px;background:var(--tx);border-radius:0 4px 4px 0}
.ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .x{opacity:0;color:var(--tx3);display:grid}.ch:hover .x{opacity:1}.ch .x svg{width:16px;height:16px}
.ch .cnt{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;font-weight:700}
.vusers{padding:2px 0 8px 30px}
.vu{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:8px;font-size:13.5px;color:var(--tx2)}
.vu:hover{background:rgba(255,255,255,.03)}
.vu .av{width:24px;height:24px;font-size:11px}
.vu .ic{margin-left:auto;display:flex;gap:4px;color:var(--tx3);align-items:center}.vu .ic svg{width:14px;height:14px}
.vu .live{background:var(--red);color:#fff;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:.02em}

/* ---------- chamada em andamento (lateral) ---------- */
#vbar{margin:0 10px 8px;padding:12px;display:none;border-radius:14px;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;border:1.5px solid transparent}
#vbar.on{display:block}
#vbar .st{color:var(--green);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px}
#vbar .st svg{width:16px;height:16px}
#vbar .wh{font-size:12px;color:var(--tx3);cursor:pointer;margin-top:2px}
#vbar .wh:hover{color:var(--tx2);text-decoration:underline}
#vbar .bt{display:flex;gap:6px;margin-top:10px}
#vbar .bt button{flex:1;height:34px;border-radius:9px;background:var(--bg3);display:grid;place-items:center;color:var(--tx2)}
#vbar .bt button:hover{background:var(--bg4);color:var(--tx)}
#vbar .bt button.on{background:var(--acs);color:var(--ac)}
#vbar .bt button.bad{color:var(--red)}
#me{height:62px;background:var(--bg0);display:flex;align-items:center;gap:4px;padding:0 8px;margin:0 10px calc(10px + var(--sab));border-radius:16px;flex-shrink:0}
#me .who{flex:1;display:flex;gap:10px;align-items:center;min-width:0;padding:6px;border-radius:12px;cursor:pointer}
#me .who:hover{background:var(--bg3)}
#me .info{min-width:0}
#me .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp)}
#me .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
#me .mb{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--tx2)}
#me .mb svg{width:18px;height:18px}
#me .mb:hover{background:var(--bg3);color:var(--tx)}
#me .mb.bad{color:var(--red);background:rgba(255,84,104,.12)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--disp);color:#fff;flex-shrink:0;position:relative;font-size:14px;background-size:cover;background-position:center}
.av .st{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg1)}
.st.online{background:var(--green)}.st.ausente{background:var(--yel)}.st.ocupado{background:var(--red)}.st.offline{background:#5d5680}
.av.speak{box-shadow:0 0 0 2px var(--bg1),0 0 0 4px var(--green)}

/* ---------- área principal ---------- */
#main{flex:1;display:flex;flex-direction:column;background:var(--bg2);min-width:0;position:relative}
#top{height:58px;display:flex;align-items:center;gap:6px;padding:0 14px;border-bottom:1px solid var(--line);flex-shrink:0;background:rgba(26,22,49,.85);backdrop-filter:blur(12px);z-index:2}
#top .t{font-family:var(--disp);font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
#top .t svg{color:var(--tx3)}
#top .topic{color:var(--tx3);font-size:13px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:12px;margin-left:4px;border-left:1px solid var(--bg4)}
.sp1{flex:1}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex-shrink:0;position:relative}
.ib:hover{background:var(--bg3);color:var(--tx)}
.ib.on{color:var(--ac);background:var(--acs)}
#search{background:var(--bg0);border:1px solid transparent;border-radius:10px;padding:8px 12px;width:170px;font-size:13px;outline:none;transition:width .2s,border-color .2s}
#search:focus{width:230px;border-color:var(--bg5)}
#search::placeholder{color:var(--tx3)}
#burger{display:none}
#banner{background:var(--yel);color:#2a1d00;font-size:13px;padding:8px 14px;text-align:center;display:none;font-weight:600}
#banner.on{display:block}#banner.red{background:var(--red);color:#fff}
#body{flex:1;display:flex;min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:12px 0 10px;overscroll-behavior:contain}

/* ---------- mensagens ---------- */
.welcome{padding:28px 22px 18px}
.welcome .big{width:76px;height:76px;border-radius:24px;background:var(--grad);display:grid;place-items:center;font-size:36px;margin-bottom:16px;color:#fff;box-shadow:0 10px 30px rgba(139,92,255,.35)}
.welcome .big svg{width:38px;height:38px}
.welcome h2{font-family:var(--disp);font-size:32px;margin-bottom:6px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.welcome p{color:var(--tx2);line-height:1.55;max-width:60ch}
.daysep{display:flex;align-items:center;gap:10px;margin:18px 22px 4px;color:var(--tx3);font-size:12px;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--bg4)}
.m{display:flex;gap:14px;padding:3px 22px;position:relative}
.m.first{margin-top:14px}
.m:hover{background:rgba(255,255,255,.03)}
.m.first .a{letter-spacing:-.005em}
.m.mention{background:var(--mention);box-shadow:inset 3px 0 0 var(--yel)}
.m.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--acs)}}
.m .av{width:42px;height:42px;font-size:16px;cursor:pointer;margin-top:2px}
.m .gut{width:42px;flex-shrink:0;font-size:10px;color:transparent;text-align:right;padding-top:4px}
.m:hover .gut{color:var(--tx3)}
.m .c{flex:1;min-width:0}
.m .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.m .a{font-family:var(--disp);font-weight:700;cursor:pointer;font-size:15.5px}.m .a:hover{text-decoration:underline}
.m .tm{font-size:11.5px;color:var(--tx3)}
.m .tx{line-height:1.5;word-wrap:break-word;white-space:pre-wrap;color:#e6e1fa;max-width:80ch}
.m .tx.big{font-size:44px;line-height:1.2}
.m .ed{font-size:10.5px;color:var(--tx3)}
.m .tx code{font-family:'JetBrains Mono',monospace;background:var(--bg0);padding:1px 6px;border-radius:5px;font-size:13px;color:var(--cy)}
.m .tx pre{font-family:'JetBrains Mono',monospace;background:var(--bg0);padding:12px 14px;border-radius:10px;font-size:13px;margin:6px 0;white-space:pre-wrap;border:1px solid var(--line)}
.m .tx blockquote{border-left:3px solid var(--vi);padding-left:10px;color:var(--tx2)}
.m .tx a{color:var(--cy)}
.m .tx .mn{background:rgba(139,92,255,.22);color:#c9b8ff;border-radius:5px;padding:0 4px;font-weight:600}
.m .tx .spl{background:var(--bg0);color:transparent;border-radius:4px;cursor:pointer;padding:0 3px}
.m .tx .spl.show{background:var(--bg4);color:inherit}
.m img.att{max-width:min(400px,100%);max-height:340px;border-radius:14px;margin-top:6px;display:block;cursor:zoom-in}
.m .reply{font-size:12.5px;color:var(--tx3);display:flex;gap:6px;align-items:center;margin-bottom:3px;cursor:pointer;overflow:hidden;white-space:nowrap}
.m .reply b{color:var(--tx2);font-weight:600}.m .reply .av{width:16px;height:16px;font-size:8px;margin:0}
.sysm{display:flex;gap:14px;padding:4px 22px;color:var(--tx3);font-size:13.5px;align-items:center;margin-top:8px}
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rc{background:var(--bg3);border:1px solid transparent;border-radius:10px;padding:3px 9px;font-size:13.5px;display:flex;gap:5px;align-items:center;font-weight:600;color:var(--tx2);transition:transform .1s}
.rc:active{transform:scale(.92)}
.rc.mine{background:var(--acs);border-color:var(--ac);color:#ffd0e4}
.rc:hover{border-color:var(--bg5)}
.tools{position:absolute;right:18px;top:-18px;background:var(--bg1);border:1px solid var(--line);border-radius:12px;display:none;box-shadow:0 8px 24px rgba(5,3,15,.5);z-index:3;overflow:hidden;padding:2px}
.m:hover .tools,.m.tap .tools{display:flex}
.tools button{width:34px;height:32px;color:var(--tx2);display:grid;place-items:center;border-radius:8px}
.tools button svg{width:17px;height:17px}
.tools button:hover{background:var(--bg3);color:var(--tx)}
.tools button.del:hover{color:var(--red)}

/* ---------- caixa de mensagem ---------- */
#comp{padding:0 18px 16px;padding-bottom:calc(14px + var(--sab));position:relative}
#typing{height:22px;font-size:12px;color:var(--tx2);padding:2px 6px;display:flex;align-items:center;gap:6px}
#typing .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin-right:2px;animation:bo 1.2s infinite}
#typing .dots span:nth-child(2){animation-delay:.15s;background:var(--vi)}#typing .dots span:nth-child(3){animation-delay:.3s;background:var(--cy)}
@keyframes bo{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
#replyBar{background:var(--bg1);border-radius:14px 14px 0 0;padding:8px 14px;font-size:13px;color:var(--tx2);display:none;justify-content:space-between;align-items:center;border:1px solid var(--line);border-bottom:0}
#replyBar.on{display:flex}
#prev{display:none;padding:10px;background:var(--bg3);border-radius:14px 14px 0 0;border-bottom:1px solid var(--line);gap:10px;align-items:flex-end}
#prev.on{display:flex}
#prev img{max-height:120px;border-radius:10px}
#box{display:flex;align-items:flex-end;background:var(--bg3);border-radius:16px;padding:5px;border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
#box:focus-within{border-color:rgba(255,79,154,.5);box-shadow:0 0 0 4px rgba(255,79,154,.08)}
#replyBar.on~#box,#prev.on~#box{border-radius:0 0 16px 16px}
#inp{flex:1;background:none;border:0;outline:none;resize:none;padding:10px 6px;max-height:200px;line-height:1.4;min-height:40px}
#inp:focus-visible{outline:none}
#inp::placeholder{color:var(--tx3)}
#sendBtn{background:var(--grad);color:#fff !important;border-radius:12px}
#sendBtn:hover{filter:brightness(1.1)}
#hint{font-size:11px;color:var(--tx3);padding:5px 6px 0}

/* ---------- membros ---------- */
#mem{width:250px;background:var(--bg1);overflow-y:auto;padding:12px 10px;flex-shrink:0;border-left:1px solid var(--line)}
#mem.hide{display:none}
.mg{font-size:13px;color:var(--tx3);font-weight:600;padding:14px 8px 6px}
.mr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}
.mr:hover{background:rgba(255,255,255,.04)}
.mr.off{opacity:.45}
.mr .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mr .sub{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crown{font-size:12px}

/* ---------- painel lateral ---------- */
#panel{width:350px;background:var(--bg1);border-left:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0}
#panel.on{display:flex}
#panel .ph{padding:14px 16px;font-family:var(--disp);font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
#panel .pb{overflow-y:auto;flex:1;padding:8px 0}
#panel .m{padding:6px 14px}

/* ---------- chamada de voz e vídeo ---------- */
#call{flex:1;display:none;flex-direction:column;min-height:0;position:relative;background:
  radial-gradient(60% 50% at 15% 10%,rgba(255,79,154,.18),transparent 70%),
  radial-gradient(55% 50% at 90% 90%,rgba(77,225,255,.14),transparent 70%),
  radial-gradient(50% 60% at 70% 20%,rgba(139,92,255,.16),transparent 70%),#08061a}
#call.on{display:flex}
#grid{flex:1;display:grid;gap:12px;padding:16px;min-height:0;align-content:center;justify-content:center}
#grid.focus{grid-template-columns:1fr !important;grid-template-rows:1fr auto}
.tile{position:relative;background:rgba(36,31,64,.75);border-radius:20px;overflow:hidden;display:grid;place-items:center;aspect-ratio:16/9;min-width:0;min-height:0;cursor:pointer;transition:box-shadow .15s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tile.speak{box-shadow:0 0 0 3px var(--green),0 0 30px rgba(62,224,143,.35)}
.tile video{width:100%;height:100%;object-fit:cover;background:#000}
.tile.scr video{object-fit:contain}
.tile.self video.mirror{transform:scaleX(-1)}
.tile .av{width:92px;height:92px;font-size:36px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tile.speak .av{box-shadow:0 0 0 4px rgba(62,224,143,.35),0 0 0 8px rgba(62,224,143,.15)}
.tile .lbl{position:absolute;left:12px;bottom:12px;background:rgba(10,8,25,.65);backdrop-filter:blur(8px);padding:5px 11px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:600;max-width:calc(100% - 24px)}
.tile .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .lbl svg{width:14px;height:14px;color:var(--red)}
.tile .fs{position:absolute;right:10px;top:10px;background:rgba(10,8,25,.6);border-radius:10px;width:36px;height:36px;display:none;place-items:center}
.tile:hover .fs{display:grid}
#strip{display:none;gap:10px;overflow-x:auto;padding:0 16px 8px}
#grid.focus+#strip{display:flex}
#strip .tile{width:180px;flex-shrink:0}
#strip .tile .av{width:48px;height:48px;font-size:20px}
#ctrl{display:flex;justify-content:center;gap:10px;margin:0 auto calc(16px + var(--sab));padding:10px;flex-wrap:wrap;background:rgba(20,17,39,.75);backdrop-filter:blur(14px);border-radius:24px;border:1px solid var(--line)}
#ctrl:empty{display:none}
.cb{width:52px;height:52px;border-radius:17px;background:var(--bg3);display:grid;place-items:center;color:var(--tx);transition:background .15s,transform .1s}
.cb:hover{background:var(--bg4)}.cb:active{transform:scale(.93)}
.cb.on{background:#fff;color:#1a1631}
.cb.bad{background:var(--red);color:#fff}

/* ================= visual 2026.11 — painéis flutuantes ================= */
:root{
  --bg0:#07060e;--bg1:#110f1d;--bg2:#151324;--bg3:#211d36;--bg4:#2c2747;--bg5:#3a335d;
  --tx:#f4f1ff;--tx2:#bcb5dc;--tx3:#8079a6;
  --line:rgba(205,190,255,.075);--edge:rgba(255,255,255,.07);
  --panel:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 160px),var(--bg2);
}
html{background:var(--bg0)}body{background:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  radial-gradient(40% 35% at 0% 0%,rgba(255,79,154,.16),transparent 70%),
  radial-gradient(45% 40% at 100% 100%,rgba(77,225,255,.10),transparent 70%),
  radial-gradient(35% 30% at 60% 0%,rgba(139,92,255,.14),transparent 70%)}
#app{padding:calc(10px + var(--sat)) 10px 10px 0;gap:10px;background:transparent}
#rail{background:transparent;padding-top:4px}
#side{background:var(--bg1);border-radius:22px;border:1px solid var(--edge);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#sideHead{border-radius:0;height:60px}
#main{background:var(--panel);border-radius:22px;border:1px solid var(--edge);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#top{background:rgba(21,19,36,.72);height:60px;border-bottom:1px solid var(--line)}
#mem{background:rgba(9,8,17,.35);border-left:1px solid var(--line);padding:14px 10px}
#panel{background:var(--bg1)}
.ch{border-radius:12px}
.ch.on{background:linear-gradient(90deg,rgba(255,79,154,.16),rgba(139,92,255,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,79,154,.18)}
.ch.on svg.i{color:#ff7fb5}
#me{background:rgba(255,255,255,.035);border:1px solid var(--edge)}
.sv{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.25)}
.m{margin:0 10px;padding:4px 14px;border-radius:14px}
.m:hover{background:rgba(255,255,255,.035)}
.m .tx{color:#e9e5fb}
.daysep{margin:20px 24px 6px}
.daysep::before,.daysep::after{background:linear-gradient(90deg,transparent,var(--bg4),transparent)}

/* ---------------- canal de reserva ----------------
   Além da conexão direta (WebRTC), todo servidor também conversa por um
   "correio" MQTT criptografado com o código do servidor. Assim mensagens,
   quem está online, jogos e música funcionam mesmo quando a conexão direta
   falha, e quem entra recebe o servidor na hora, mesmo sem ninguém online. */
const BROKERS=['wss://public:public@public.cloud.shiftr.io','wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const RELAY_ACTS=new Set(['hello','msg','chan','meta','typing','vstate','react','bye','game','music','dm']);
const SESSION=uid(10);
const RL={mq:null,clients:[],subs:{},byTopic:{},seen:new Set(),lastState:{}};
const _enc=new TextEncoder(),_dec=new TextDecoder();
const _gz=async(data,dir)=>new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(dir?new CompressionStream('gzip'):new DecompressionStream('gzip'))).arrayBuffer());
async function relayKeys(code){const h=async t=>new Uint8Array(await crypto.subtle.digest('SHA-256',_enc.encode(t)));
  const id=[...await h('nexo-topico:'+code)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('');
  const key=await crypto.subtle.importKey('raw',await h('nexo-chave:'+code),'AES-GCM',false,['encrypt','decrypt']);
  return{live:'nexo3/'+id+'/ao-vivo',state:'nexo3/'+id+'/estado',key}}
async function seal(key,obj){let data=_enc.encode(JSON.stringify(obj)),z=0;
  if(data.length>600&&typeof CompressionStream!=='undefined'){data=await _gz(data,1);z=1}
  const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data));
  const out=new Uint8Array(13+ct.length);out[0]=z;out.set(iv,1);out.set(ct,13);return out}
async function unseal(key,buf){const b=new Uint8Array(buf);if(b.length<14)return null;
  let data=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(1,13)},key,b.slice(13)));
  if(b[0])data=await _gz(data,0);return JSON.parse(_dec.decode(data))}
const relayUp=()=>RL.clients.filter(c=>c.connected).length;
async function loadRelay(){if(RL.mq||!/^https?:$/.test(location.protocol))return;
  try{const m=await import('https://esm.run/mqtt@5.10.1');RL.mq=m.default?.connect?m.default:m}catch(e){console.warn('reserva',e);return}
  for(const url of BROKERS){let c;try{c=RL.mq.connect(url,{reconnectPeriod:5000,connectTimeout:12000,keepalive:30,clean:true,resubscribe:true})}catch(e){continue}
    RL.clients.push(c);
    c.on('connect',()=>{const t=[];for(const code in RL.subs)t.push(RL.subs[code].live,RL.subs[code].state);if(t.length)c.subscribe(t);netChanged();
      clearTimeout(RL.hT);RL.hT=setTimeout(()=>{for(const k in RL.subs)relayHello(k)},500)});
    c.on('close',netChanged);c.on('offline',netChanged);c.on('error',()=>{});
    c.on('message',(topic,buf)=>relayRecv(topic,buf))}
  for(const code in DATA.servers)relayJoin(code)}
async function relayJoin(code){if(!RL.mq||RL.subs[code])return;const sub={seen:{},pending:true};RL.subs[code]=sub;
  Object.assign(sub,await relayKeys(code));sub.pending=false;RL.byTopic[sub.live]=code;RL.byTopic[sub.state]=code;
  for(const c of RL.clients)if(c.connected)c.subscribe([sub.live,sub.state]);
  relayHello(code);setTimeout(()=>relayState(code),4000)}
function relayLeave(code){const sub=RL.subs[code];if(!sub)return;delete RL.subs[code];delete RL.byTopic[sub.live];delete RL.byTopic[sub.state];
  for(const c of RL.clients)try{c.unsubscribe([sub.live,sub.state])}catch(e){}}
function relayKick(){for(const c of RL.clients)if(!c.connected)try{c.reconnect()}catch(e){}}
async function relayPub(code,n,d,retain){const sub=RL.subs[code];if(!sub||sub.pending||!relayUp())return false;
  const env={n,d,u:ME.id,s:SESSION,i:uid(12),t:Date.now()};let buf;try{buf=await seal(sub.key,env)}catch(e){return false}
  if(buf.length>110000)return false; // grande demais (imagem): só pela conexão direta
  for(const c of RL.clients)if(c.connected)try{c.publish(retain?sub.state:sub.live,buf,{qos:0,retain:!!retain})}catch(e){}
  return true}
async function relayRecv(topic,buf){const code=RL.byTopic[topic];const sub=RL.subs[code];if(!sub||!buf?.length)return;
  let e;try{e=await unseal(sub.key,buf)}catch(err){return}
  if(!e||!e.n||e.s===SESSION)return;
  if(e.i){if(RL.seen.has(e.i))return;RL.seen.add(e.i);if(RL.seen.size>4000)RL.seen=new Set([...RL.seen].slice(-2000))}
  if(!DATA.servers[code]||!e.u)return;
  if(topic===sub.state){if(e.n==='sync')try{handle(code,'sync',e.d,'r:'+e.u)}catch(err){console.warn(err)}return}
  if(e.u===ME.id&&e.n!=='msg')return;
  const was=relayOnline(code,e.u);
  if(e.u!==ME.id&&e.n!=='bye')sub.seen[e.u]=Date.now();
  // quem acabou de aparecer recebe um "oi" nosso logo, para nos ver online também
  if(e.n==='hello'&&!was&&e.d?.u?.id===e.u){clearTimeout(sub.helloT);sub.helloT=setTimeout(()=>relayHello(code),800+Math.random()*1200)}
  try{handle(code,e.n,e.d,'r:'+e.u)}catch(err){console.warn(e.n,err)}
  if(!was&&e.u!==ME.id)renderAll()}
function relayHello(code){relayPub(code,'hello',{u:profile()})}
// foto do servidor guardada no correio: quem entra recebe tudo na hora
function statePayload(code,per){const d=syncPayload(code);const msgs={};
  for(const ch in d.msgs)msgs[ch]=d.msgs[ch].slice(0,per).map(m=>m.img&&m.img.length>30000?{...m,img:'',imgOff:true}:m);
  const members={};d.members[ME.id]={...profile(),seen:Date.now()};for(const u in d.members){const m=d.members[u];members[u]=m.avatar&&m.avatar.length>20000?{...m,avatar:''}:m}
  return{...d,msgs,members,games:d.games.slice(0,per>30?25:8)}}
async function relayState(code){const sub=RL.subs[code];const s=DATA.servers[code];if(!sub||sub.pending||!s||!relayUp()||!s.meta.v)return;
  for(const per of[60,30,12,4]){const d=statePayload(code,per);const sig=JSON.stringify(d);
    if(RL.lastState[code]===sig)return;
    let buf;try{buf=await seal(sub.key,{n:'sync',d,u:ME.id,s:SESSION,i:uid(12),t:Date.now()})}catch(e){return}
    if(buf.length>100000)continue;
    for(const c of RL.clients)if(c.connected)try{c.publish(sub.state,buf,{qos:1,retain:true})}catch(e){}
    RL.lastState[code]=sig;return}}
let stateT=null;function relayStateSoon(){clearTimeout(stateT);stateT=setTimeout(()=>{for(const c in DATA.servers)relayState(c)},6000)}
setInterval(()=>{for(const c in DATA.servers)relayHello(c)},25000);
// presença expira sozinha quando alguém some
setInterval(()=>{let ch=false;for(const c in RL.subs)for(const u in RL.subs[c].seen){const t=RL.subs[c].seen[u];if(Date.now()-t>75000&&Date.now()-t<87000)ch=true}if(ch)renderAll()},10000);

let lastHidden=0,netBad=0;
setInterval(()=>{if(!navigator.onLine)return;relayKick();
  const any=Object.keys(DATA.servers).length;if(!any||CALL)return;

  if(lastHidden&&Date.now()-lastHidden>4*60*1000&&!CALL)reconnectAll();else{relayKick();for(const c in DATA.servers)relayHello(c)}});
function netState(){if(!navigator.onLine)return'off';if(relayUp()||Object.values(NETMOD?.getRelaySockets?.()||{}).some(w=>w?.readyState===1))return'ok';return netOK||RL.mq?'busy':'off'}
let netT=null;function netChanged(){clearTimeout(netT);netT=setTimeout(()=>{renderTop();renderMe()},300)}
const ACTIONS=['hello','sync','msg','chan','meta','typing','vstate','dm','react','bye','game','music','arena'];
function connect(code){if(!joinRoomFn){relayJoin(code);return}if(ROOMS[code])return;
  relayJoin(code);
  const room=joinRoomFn({appId:APP_ID,password:'nx-'+code,turnConfig:TURN,relayUrls:BROKERS,relayRedundancy:BROKERS.length},'srv-'+code,err=>console.warn('sala',err));
  const A={};const R={room,A,peers:{}};ROOMS[code]=R;
  for(const n of ACTIONS){const[s,g]=room.makeAction(n);A[n]=s;g((d,p)=>{try{handle(code,n,d,p)}catch(e){console.warn(n,e)}})}
  room.onPeerJoin(p=>greet(code,p));
  room.onPeerLeave(p=>{const u=R.peers[p];delete R.peers[p];dropRemote(p);
    if(u&&VOICE[code]?.[u]?.peer===p){delete VOICE[code][u];if(CALL&&CALL.srv===code)sfx('leave')}renderAll()});
  room.onPeerStream((stream,p,meta)=>onStream(code,stream,p,meta));
}
function reconnectAll(){if(CALL)leaveCall(true);for(const code of Object.keys(ROOMS)){try{ROOMS[code].room.leave()}catch(e){}delete ROOMS[code];delete VOICE[code]}
  relayKick();for(const code in DATA.servers)connect(code);for(const code in DATA.servers)relayHello(code);renderAll()}
function greet(code,p){const R=ROOMS[code];if(!R)return;
  R.A.hello({u:profile()},p);R.A.sync(syncPayload(code),p);
  if(CALL&&CALL.srv===code)R.A.vstate(myV(),p)}
function broadcast(code,n,d,target){const R=ROOMS[code];if(R)try{R.A[n](d,target??null)}catch(e){console.warn('envio',n,e)}
  if(target==null&&RELAY_ACTS.has(n))relayPub(code,n,d)}
function syncPayload(code){const s=DATA.servers[code];const msgs={};
  for(const ch in s.msgs){msgs[ch]=Object.values(s.msgs[ch]).sort((a,b)=>b.ts-a.ts).slice(0,120)}
  const games=Object.values(s.games||{}).sort((a,b)=>b.ts-a.ts).slice(0,40);
  return{meta:s.meta,channels:s.channels,msgs,games,music:s.music||null,members:Object.fromEntries(Object.entries(s.members).filter(([k])=>k!==ME.id))}}

function mergeMsg(s,m){if(!m||!m.id||!m.ch)return false;s.msgs[m.ch]??={};const cur=s.msgs[m.ch][m.id];
  if(!cur){s.msgs[m.ch][m.id]=m;return 'new'}
  let ch=false;if((m.v||0)>(cur.v||0)){const r=cur.reactions;Object.assign(cur,m);cur.reactions=r;ch=true}
  for(const e in m.reactions||{})for(const u in m.reactions[e]){cur.reactions??={};cur.reactions[e]??={};const a=cur.reactions[e][u],b=m.reactions[e][u];if(!a||b.t>a.t){cur.reactions[e][u]=b;ch=true}}
  return ch}
function acceptMeta(s,d,from){if(!d||(d.v||0)<=(s.meta.v||0))return false;
  // só o dono pode mudar quem é o dono ou a lista de expulsos
  if(s.meta.owner&&from!==s.meta.owner)d={...d,owner:s.meta.owner,kicked:s.meta.kicked||{}};
  s.meta=d;for(const u in d.kicked||{})delete s.members[u];return true}
function mergeServerState(code,d,from){const s=DATA.servers[code];let ch=false;
  if(d.meta&&acceptMeta(s,d.meta,from))ch=true;
  for(const g of d.games||[])if(mergeGame(s,g))ch=true;
  if(d.music&&(d.music.v||0)>(s.music?.v||0)){s.music=d.music;ch=true;if(code===UI.listenSrv)musicApply();else if(d.music.playing)autoListen(code)}
  for(const id in d.channels||{}){const c=d.channels[id];if(!s.channels[id]||(c.v||0)>(s.channels[id].v||0)){s.channels[id]=c;ch=true}}
  for(const u in d.members||{}){if(u===ME.id||s.meta.kicked?.[u])continue;const m=d.members[u];if(!s.members[u]||(m.v||0)>(s.members[u].v||0)){s.members[u]=m;ch=true}}
  for(const c in d.msgs||{})for(const m of d.msgs[c]||[])if(mergeMsg(s,m))ch=true;
  return ch}

function handle(code,n,d,p){const s=DATA.servers[code];if(!s)return;const R=ROOMS[code];
  const isR=typeof p==='string'&&p.startsWith('r:');
  const su=isR?p.slice(2):R?.peers[p];if(su&&s.meta.kicked?.[su]&&n!=='hello')return; // ignora quem foi expulso
  if(isR&&n==='hello'){if(!d?.u?.id||d.u.id!==su)return;if(s.meta.kicked?.[su]){relayPub(code,'meta',s.meta);return}
    const old=s.members[su];if(!old||(d.u.v||0)>=(old.v||0))s.members[su]={...d.u,seen:Date.now()};save();renderAll();return}
  if(!isR&&!R)return;
  switch(n){
  case'hello':{if(!d?.u?.id)return;if(s.meta.kicked?.[d.u.id]){R.peers[p]=d.u.id;R.A.meta(s.meta,p);return}
    const first=!R.peers[p];R.peers[p]=d.u.id;const old=s.members[d.u.id];
    if(!old||(d.u.v||0)>=(old.v||0))s.members[d.u.id]={...d.u,seen:Date.now()};
    if(first){const box=DATA.dms[d.u.id];if(box){const mine=Object.values(box.msgs).filter(m=>m.author===ME.id).sort((a,b)=>b.ts-a.ts).slice(0,100);if(mine.length)mine.forEach(m=>R.A.dm(m,p))}}
    save();renderAll();break}
  case'sync':{if(mergeServerState(code,d,su)){save();if(checkKicked(code))return;if(V.srv===code){ensureCh();renderAll();renderMsgs(true);markRead()}else renderRail()}break}
  case'msg':{const r=mergeMsg(s,d);if(!r)return;save();
    if(r==='new'&&d.author!==ME.id){d._new=true;notify(code,d);maybeAnswerAI(code,d)}
    if(V.srv===code&&V.ch===d.ch){const nb=nearBottom();renderMsgs(nb);markRead()}else renderSide(),renderRail();
    delete UI.typing[d.author];renderTyping();break}
  case'chan':{if(!d?.id)return;const c=s.channels[d.id];if(!c||(d.v||0)>(c.v||0)){s.channels[d.id]=d;save();if(V.srv===code){const had=V.ch;ensureCh();if(had!==V.ch)renderMsgs(true)}renderAll()}break}
  case'meta':{if(acceptMeta(s,d,su)){save();if(checkKicked(code))return;renderAll();if(V.srv===code)renderMsgs(nearBottom())}break}
  case'music':{if((d?.v||0)>(s.music?.v||0)){s.music=d;save();if(code===UI.listenSrv)musicApply();else if(d.playing)autoListen(code);if(V.srv===code&&UI.panel==='music')renderPanel();renderVBar();renderMusicBar()}break}
  case'game':{if(mergeGame(s,d)){save();if(V.srv===code&&V.ch===d.ch)renderMsgs(nearBottom());arenaMaybeOpen(code,s.games[d.id])}break}
  case'arena':{if(!isR)arenaMsg(su,d);break}
  case'typing':{if(V.srv!==code||d.ch!==V.ch)return;UI.typing[d.u]=Date.now();renderTyping();break}
  case'react':{const m=s.msgs[d.ch]?.[d.mid];if(!m)return;m.reactions??={};m.reactions[d.e]??={};const a=m.reactions[d.e][d.u];
    if(!a||d.t>a.t){m.reactions[d.e][d.u]={on:d.on,t:d.t};save();if(V.srv===code&&V.ch===d.ch)renderMsgs(nearBottom())}break}
  case'vstate':{if(isR){if(!su||p2pOnline(code,su))return;onVState(code,su,null,d);break}
    const u=R.peers[p]||d.u;if(!u)return;if(!R.peers[p])R.peers[p]=u;onVState(code,u,p,d);break}
  case'dm':{const from=su;if(!from||!d?.id||(isR&&d.to!==ME.id))return;const box=DATA.dms[from]??={msgs:{},read:0};
    if(d.del){delete box.msgs[d.id]}else{const cur=box.msgs[d.id];if(cur&&(cur.v||0)>=(d.v||0))return;const isNew=!cur;box.msgs[d.id]={...d,author:d.author===ME.id?ME.id:from};
      if(isNew&&d.author!==ME.id)notify(null,{...d,author:from,dm:true})}
    save();if(V.dm===from){renderMsgs(nearBottom());markRead()}else renderAll();break}
  case'bye':{const u=su;if(u){delete s.members[u];if(RL.subs[code])delete RL.subs[code].seen[u]}save();renderAll();break}
  }}
function sendDM(to,msg){let sent=false;for(const code in ROOMS){const R=ROOMS[code];const ps=Object.entries(R.peers).filter(([,u])=>u===to).map(([p])=>p);
  if(ps.length){R.A.dm(msg,ps);sent=true;break}}
  if(!sent){const code=Object.keys(DATA.servers).find(c=>DATA.servers[c].members[to]&&RL.subs[c]);if(code){relayPub(code,'dm',{...msg,to});sent=relayOnline(code,to)}}
  return sent}

/* ---------------- expulsar ---------------- */
const isOwner=(code=V.srv)=>DATA.servers[code]?.meta.owner===ME.id;
function checkKicked(code){const s=DATA.servers[code];if(!s?.meta.kicked?.[ME.id])return false;const name=s.meta.name;
  leaveServer(code,true);modal(`<h3>Você foi expulso</h3><p class="sub">O dono do servidor <b>${esc(name)}</b> tirou você de lá.</p><div class="row"><button class="btn" data-close>Ok</button></div>`);return true}
function kickUser(u){const s=srv();if(!s||!isOwner()||u===ME.id)return;s.kickedNames??={};s.kickedNames[u]=nameOf(u);
  s.meta={...s.meta,kicked:{...(s.meta.kicked||{}),[u]:Date.now()},v:Date.now()};delete s.members[u];
  if(VOICE[s.code]?.[u]){const pr=VOICE[s.code][u].peer;delete VOICE[s.code][u];dropRemote(pr)}
  broadcast(s.code,'meta',s.meta);save();renderAll();renderMsgs(false);toast(`${nameOf(u)} foi expulso do servidor`)}
function unkickUser(u){const s=srv();if(!s||!isOwner())return;const k={...(s.meta.kicked||{})};delete k[u];
  s.meta={...s.meta,kicked:k,v:Date.now()};broadcast(s.code,'meta',s.meta);save();toast('Pronto, essa pessoa pode entrar de novo pelo convite')}

function newServerObj(code,name,icon,color){return{code,meta:{name,icon,color,owner:ME.id,v:Date.now(),created:Date.now()},channels:{},msgs:{},members:{},read:{}}}
function createServer(name,icon,color){const code=uid(10);const s=newServerObj(code,name,icon,color);const t=Date.now();
  [['geral','text'],['memes','text'],['jogos','text'],['Sala de voz','voice'],['Jogando juntos','voice']].forEach(([n,ty],i)=>{const id=uid(8);s.channels[id]={id,name:n,type:ty,order:i,topic:i===0?'Papo livre — sejam bem-vindos!':'',v:t}});
  DATA.servers[code]=s;save();connect(code);openServer(code);setTimeout(()=>inviteModal(),300)}
function joinServer(code){code=String(code).trim();const m=code.match(/entrar=([a-z0-9]+)/i);if(m)code=m[1];code=code.replace(/[^a-z0-9]/gi,'').toLowerCase();
  if(code.length<6){toast('Código de convite inválido');return}
  if(!DATA.servers[code]){const s=newServerObj(code,'Entrando…','⏳','#5b6472');s.meta.v=0;s.meta.owner='';DATA.servers[code]=s;save();
    toast('Entrando no servidor…')}
  connect(code);openServer(code)}
function leaveServer(code,quiet){if(CALL?.srv===code)leaveCall();if(!quiet)broadcast(code,'bye',{});const R=ROOMS[code];setTimeout(()=>{try{R?.room.leave()}catch(e){}relayLeave(code)},400);delete ROOMS[code];
  delete DATA.servers[code];delete VOICE[code];save();if(V.srv===code||!quiet)openHome();else renderAll()}
function ensureCh(){const s=srv();if(!s)return;const c=s.channels[V.ch];if(!c||c.deleted)V.ch=sortedChans('text')[0]?.id||null}
function sortedChans(type){const s=srv();if(!s)return[];return Object.values(s.channels).filter(c=>!c.deleted&&(c.type||'text')===type).sort((a,b)=>(a.order||0)-(b.order||0))}
function unreadCount(s,ch){const r=s.read?.[ch]||0;let n=0;for(const m of Object.values(s.msgs[ch]||{}))if(m.ts>r&&m.author!==ME.id&&!m.deleted)n++;return n}
function serverUnread(s){return Object.values(s.channels).some(c=>!c.deleted&&c.type!=='voice'&&unreadCount(s,c.id)>0)}
function mentionCount(s){let n=0;for(const c of Object.values(s.channels)){if(c.deleted)continue;const r=s.read?.[c.id]||0;for(const m of Object.values(s.msgs[c.id]||{}))if(m.ts>r&&mentionsMe(m))n++}return n}
function dmUnread(u){const b=DATA.dms[u];if(!b)return 0;return Object.values(b.msgs).filter(m=>m.ts>(b.read||0)&&m.author!==ME.id).length}

function curMsgs(){if(V.dm)return Object.values(DATA.dms[V.dm]?.msgs||{}).sort((a,b)=>a.ts-b.ts);
  if(!V.srv||!V.ch)return[];return Object.values(srv().msgs[V.ch]||{}).filter(m=>!m.deleted).sort((a,b)=>a.ts-b.ts)}
function fmt(text){let t=esc(text);const blocks=[];
  t=t.replace(/```(?:\w+\n)?([\s\S]*?)```/g,(_,c)=>{blocks.push(c.replace(/^\n/,''));return `\u0000${blocks.length-1}\u0000`});
  t=t.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>')
   .replace(/`([^`\n]+)`/g,'<code>$1</code>')
   .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<u>$1</u>')
   .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>')
   .replace(/\|\|([^|\n]+)\|\|/g,'<span class="spl">$1</span>')
   .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
   .replace(/(^|\s)@([\wÀ-ÿ.\-]+)/g,'$1<span class="mn">@$2</span>');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`)}
const onlyEmoji=t=>t&&t.length<=12&&/^(\p{Extended_Pictographic}|‍|️|\s)+$/u.test(t);
function mentionsMe(m){if(m.author===ME.id)return false;const t=(m.text||'').toLowerCase();const n=(ME.name||'').toLowerCase().split(' ')[0];return (n&&t.includes('@'+n))||t.includes('@todos')||t.includes('@everyone')}
function reactList(m){const out=[];for(const e in m.reactions||{}){const us=Object.entries(m.reactions[e]).filter(([,v])=>v.on).map(([u])=>u);if(us.length)out.push([e,us])}return out}

function renderMsgs(stick=true){const e=$('#msgs');if(!V.dm&&(!V.srv||!V.ch||chan()?.type==='voice')){if(V.srv&&!V.ch)e.innerHTML=!srv().meta.v?`<div class="welcome joinwait"><div class="big spin">⏳</div><h2>Entrando no servidor…</h2><p>Estou buscando as conversas deste servidor. Normalmente leva só alguns segundos.</p><p class="sub2">Se demorar mais de um minuto, confira se o link está completo, ou peça para alguém que já está no servidor abrir o Nexo.</p></div>`:`<div class="welcome"><div class="big">${ico('hash')}</div><h2>Nenhum canal</h2><p>Crie um canal de texto com o ＋ na lateral.</p></div>`;renderPanel();return}

  M.i++;if(M.i<M.q.length){M.playing=true;M.t0=Date.now();M.pos=0}else{M.playing=false;M.pos=0;M._done=true}musicSet(code,M)}

const PK_R='23456789TJQKA';const PK_SUIT={c:'♣',d:'♦',h:'♥',s:'♠'};
const PK_NAMES=['Carta alta','Par','Dois pares','Trinca','Sequência','Flush','Full house','Quadra','Straight flush'];
const PK_BB=20,PK_SB=10,PK_START=1000;
function pkDeck(){const d=[];for(const r of PK_R)for(const s of 'cdhs')d.push(r+s);return shuffle(d)}
function pkEval(cards){const rv=c=>PK_R.indexOf(c[0])+2;const vals=cards.map(rv).sort((a,b)=>b-a);
  const bySuit={};for(const c of cards)(bySuit[c[1]]??=[]).push(rv(c));
  const cnt={};for(const v of vals)cnt[v]=(cnt[v]||0)+1;
  const sHigh=vs=>{const u=[...new Set(vs)].sort((a,b)=>b-a);if(u.includes(14))u.push(1);let run=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]-1){if(++run>=5)return u[i]+4}else run=1}return 0};
  for(const s in bySuit)if(bySuit[s].length>=5){const h=sHigh(bySuit[s]);if(h)return[8,h]}
  const G=Object.entries(cnt).map(([v,c])=>[+v,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  if(G[0][1]===4)return[7,G[0][0],vals.find(v=>v!==G[0][0])];
  if(G[0][1]===3&&G[1]&&G[1][1]>=2)return[6,G[0][0],G[1][0]];
  for(const s in bySuit)if(bySuit[s].length>=5)return[5,...bySuit[s].sort((a,b)=>b-a).slice(0,5)];
  const sh=sHigh(vals);if(sh)return[4,sh];
  if(G[0][1]===3)return[3,G[0][0],...vals.filter(v=>v!==G[0][0]).slice(0,2)];
  if(G[0][1]===2&&G[1]&&G[1][1]===2)return[2,G[0][0],G[1][0],vals.find(v=>v!==G[0][0]&&v!==G[1][0])];
  if(G[0][1]===2)return[1,G[0][0],...vals.filter(v=>v!==G[0][0]).slice(0,3)];

function pkCmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}

function pkStart(id){const g=getGame(id);if(!g||g.players[0]!==ME.id||g.players.length<2||g.pk?.started)return;
  g.pk={started:true,chips:Object.fromEntries(g.players.map(u=>[u,PK_START])),dealer:null,hand:0};g.winner=null;pkNewHand(g);pushGame(g);sfx('join')}
function pkNewHand(g){const P=g.pk;const seats=g.players.filter(u=>(P.chips[u]||0)>0);
  if(seats.length<2){g.winner=seats[0]||'empate';P.stage='end';return}
  P.seats=seats;P.dealer=P.dealer&&seats.includes(P.dealer)?pkNext(P,P.dealer,()=>true):(P.dealer?pkNext({seats:g.players},P.dealer,u=>seats.includes(u)):seats[0]);
  P.deck=pkDeck();P.board=[];P.hole={};for(const u of seats)P.hole[u]=[P.deck.pop(),P.deck.pop()];
  P.bet={};P.folded={};P.allin={};P.acted={};P.pot=0;P.stage='pre';P.show={};P.result=null;P.hand++;
  const sb=seats.length===2?P.dealer:pkNext(P,P.dealer,()=>true);const bb=pkNext(P,sb,()=>true);
  pkPut(P,sb,PK_SB);pkPut(P,bb,PK_BB);P.cur=PK_BB;P.minRaise=PK_BB;
  P.toAct=pkNext(P,bb,u=>!P.allin[u]);P.log=`Mão ${P.hand}: ${nameOf(sb)} pôs ${PK_SB} e ${nameOf(bb)} pôs ${PK_BB}`;

function pkAct(id,act){const g=getGame(id);const P=g?.pk;if(!P?.started||P.stage==='done'||P.stage==='end'||P.toAct!==ME.id)return;

function voiceUsers(code,ch){const out=[];for(const[u,v]of Object.entries(VOICE[code]||{}))if(v.ch===ch)out.push({u,...v});
  if(CALL&&CALL.srv===code&&CALL.ch===ch)out.unshift({u:ME.id,mute:CALL.mute,deaf:CALL.deaf,cam:!!CALL.cam,screen:!!CALL.screen});return out}
function myV(){return CALL?{u:ME.id,ch:CALL.ch,mute:CALL.mute,deaf:CALL.deaf,cam:!!CALL.cam,screen:!!CALL.screen}:{u:ME.id,ch:null}}
function callPeers(){if(!CALL)return[];const R=ROOMS[CALL.srv];if(!R)return[];return Object.entries(VOICE[CALL.srv]||{}).filter(([,v])=>v.ch===CALL.ch&&R.peers[v.peer]).map(([,v])=>v.peer)}
function sendMyStreams(peers){if(!CALL||!peers.length)return;const R=ROOMS[CALL.srv];if(!R)return;
  if(CALL.mic)R.room.addStream(CALL.mic,peers,{k:'mic'});
  if(CALL.cam)R.room.addStream(CALL.cam,peers,{k:'cam'});
  if(CALL.screen)R.room.addStream(CALL.screen,peers,{k:'screen'})}
function onVState(code,u,p,d){VOICE[code]??={};const prev=VOICE[code][u];const st={...d,peer:p};
  if(d.ch)VOICE[code][u]=st;else delete VOICE[code][u];
  if(CALL&&CALL.srv===code&&p){const wasIn=prev&&prev.ch===CALL.ch&&prev.peer===p,isIn=d.ch===CALL.ch;
    if(isIn&&!wasIn){sendMyStreams([p]);sfx('join')}
    if(wasIn&&!isIn){dropRemote(p);sfx('leave');const R=ROOMS[code];for(const s of[CALL.mic,CALL.cam,CALL.screen])if(s)try{R.room.removeStream(s,[p])}catch(e){}}
    if(isIn){if(!d.cam&&REMOTE[p]?.cam){delete REMOTE[p].cam}if(!d.screen&&REMOTE[p]?.screen){delete REMOTE[p].screen}}}
  applyDeaf();renderSide();renderMem();if(V.srv===code&&chan()?.type==='voice')renderCall();renderVBar()}
function onStream(code,stream,p,meta){const k=meta?.k||(stream.getVideoTracks().length?'cam':'mic');
  REMOTE[p]??={};REMOTE[p][k]=stream;
  stream.getTracks().forEach(t=>t.addEventListener('ended',()=>{if(REMOTE[p]?.[k]===stream){delete REMOTE[p][k];renderCall()}}));
  if(k==='mic'){let a=document.getElementById('au-'+p);if(!a){a=document.createElement('audio');a.id='au-'+p;a.autoplay=true;a.playsInline=true;$('#audios').appendChild(a)}a.srcObject=stream;a.muted=!!CALL?.deaf;applySink(a);applyVolumes();a.play().catch(()=>{});watchLevel('p:'+p,stream)}
  renderCall()}
function dropRemote(p){delete REMOTE[p];document.getElementById('au-'+p)?.remove();levels.delete('p:'+p);for(const k of['cam','screen'])tileEls.get(p+':'+k)?.remove(),tileEls.delete(p+':'+k);renderCall()}
function applyDeaf(){document.querySelectorAll('#audios audio').forEach(a=>a.muted=!!CALL?.deaf);document.querySelectorAll('#grid video:not([data-self]),#strip video:not([data-self])').forEach(v=>{if(v.dataset.k==='screen')v.muted=!!CALL?.deaf})}

async function joinCall(code,ch,withCam){if(!netOK){toast('Sem conexão com a rede.');return}
  if(!navigator.mediaDevices?.getUserMedia){toast('Seu navegador não permite chamadas aqui. Abra o Nexo por um link https.');return}
  if(CALL&&CALL.srv===code&&CALL.ch===ch){if(withCam&&!CALL.cam)toggleCam();return}
  if(CALL)leaveCall(true);
  let mic,noMic=false;try{mic=await getCallMic()}
  catch(e){console.warn('mic',e);
    // sem microfone ainda dá para entrar: ouvindo, com câmera e tela
    try{const a=ac()||new AudioContext();const d=a.createMediaStreamDestination();mic=d.stream;noMic=true}catch(x){toast('Não consegui abrir o microfone.');return}
    toast(e.name==='NotAllowedError'?'Microfone bloqueado: você entrou só ouvindo. Libere o microfone no cadeado ao lado do endereço.':e.name==='NotReadableError'?'O microfone está sendo usado por outro programa. Você entrou só ouvindo.':'Não encontrei um microfone. Você entrou só ouvindo.')}
  CALL={srv:code,ch,mic,cam:null,screen:null,mute:noMic,noMic,deaf:false};ac()?.resume?.();
  watchLevel('me',mic);broadcast(code,'vstate',myV());sendMyStreams(callPeers());sfx('join');
  if(withCam)await toggleCam();
  if(V.srv!==code||V.ch!==ch){V.srv=code;V.dm=null;openChannel(ch)}else renderAll()}
function leaveCall(silent){if(!CALL)return;MICP?.stop();MICP=null;const R=ROOMS[CALL.srv];const peers=callPeers();
  for(const s of[CALL.mic,CALL.cam,CALL.screen])if(s){try{peers.length&&R?.room.removeStream(s,peers)}catch(e){}s.getTracks().forEach(t=>t.stop())}
  const code=CALL.srv;CALL=null;broadcast(code,'vstate',{u:ME.id,ch:null});
  for(const p of Object.keys(REMOTE))dropRemote(p);levels.delete('me');speaking.delete(ME.id);
  tileEls.forEach(el=>el.remove());tileEls.clear();UI.focus=null;if(!silent)sfx('leave');renderAll()}
function toggleMute(){if(!CALL)return;if(CALL.noMic){toast('Você entrou sem microfone. Libere o microfone, saia da chamada e entre de novo.');return}CALL.mute=!CALL.mute;if(!CALL.mute&&CALL.deaf)CALL.deaf=false,applyDeaf();CALL.mic.getAudioTracks().forEach(t=>t.enabled=!CALL.mute);sfx(CALL.mute?'leave':'join');broadcast(CALL.srv,'vstate',myV());renderAll()}
function toggleDeaf(){if(!CALL)return;CALL.deaf=!CALL.deaf;if(CALL.deaf){CALL._wasMuted=CALL.mute;CALL.mute=true}else CALL.mute=!!CALL._wasMuted;
  CALL.mic.getAudioTracks().forEach(t=>t.enabled=!CALL.mute);applyDeaf();broadcast(CALL.srv,'vstate',myV());renderAll()}
async function toggleCam(){if(!CALL)return;const R=ROOMS[CALL.srv];
  if(CALL.cam){const peers=callPeers();try{peers.length&&R.room.removeStream(CALL.cam,peers)}catch(e){}CALL.cam.getTracks().forEach(t=>t.stop());CALL.cam=null}
  else{try{CALL.cam=await getCam()}catch(e){console.warn('camera',e);alertModal('Câmera',camErrorMsg(e));return}
    const peers=callPeers();if(peers.length)try{R.room.addStream(CALL.cam,peers,{k:'cam'})}catch(e){console.warn(e)}}
  broadcast(CALL.srv,'vstate',myV());renderAll()}
async function toggleScreen(){if(!CALL)return;const R=ROOMS[CALL.srv];
  if(CALL.screen){const peers=callPeers();try{peers.length&&R.room.removeStream(CALL.screen,peers)}catch(e){}CALL.screen.getTracks().forEach(t=>t.stop());CALL.screen=null}
  else{if(!navigator.mediaDevices?.getDisplayMedia){toast('Compartilhar tela só funciona no computador (Chrome, Edge ou Firefox).');return}
    try{CALL.screen=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30}},audio:true})}catch(e){return}
    CALL.screen.getVideoTracks()[0].addEventListener('ended',()=>{if(CALL?.screen)toggleScreen()});
    const peers=callPeers();if(peers.length)R.room.addStream(CALL.screen,peers,{k:'screen'});UI.focus='me:screen'}
  broadcast(CALL.srv,'vstate',myV());renderAll()}
async function switchCam(){if(!CALL?.cam)return;const cur=CALL.cam.getVideoTracks()[0]?.getSettings?.().facingMode;const R=ROOMS[CALL.srv];
  let ns;try{ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:cur==='environment'?'user':'environment'},audio:false})}catch(e){toast('Não deu para trocar a câmera');return}
  const peers=callPeers();try{peers.length&&R.room.removeStream(CALL.cam,peers)}catch(e){}CALL.cam.getTracks().forEach(t=>t.stop());
  CALL.cam=ns;if(peers.length)R.room.addStream(ns,peers,{k:'cam'});renderCall()}

/* ---- dispositivos de áudio e vídeo ---- */
const pref=k=>ls.get('dev:'+k,'');
function audioC(){const c={echoCancellation:ls.get('echo',true),noiseSuppression:ls.get('ns',true),autoGainControl:ls.get('agc',true)};if(pref('mic'))c.deviceId={exact:pref('mic')};return c}
async function getMic(){try{return await navigator.mediaDevices.getUserMedia({audio:audioC(),video:false})}
  catch(e){if(pref('mic')&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){ls.set('dev:mic','');toast('O microfone escolhido não foi encontrado. Usando o padrão.');return navigator.mediaDevices.getUserMedia({audio:audioC(),video:false})}throw e}}
/* processamento do microfone: volume e sensibilidade (como no Discord).
   A sensibilidade é um "portão": abaixo do limite o microfone fica mudo,
   assim barulho baixo (teclado, ventilador) não vai para a chamada. */
const micVol=()=>ls.get('micvol',100),micAuto=()=>ls.get('micsens-auto',true),micSens=()=>ls.get('micsens',-50);
function makeMicProc(raw){const a=ac();if(!a)return null;
  try{const src=a.createMediaStreamSource(raw),g=a.createGain(),gate=a.createGain(),an=a.createAnalyser(),dst=a.createMediaStreamDestination();
    g.gain.value=micVol()/100;an.fftSize=1024;src.connect(g);g.connect(an);g.connect(gate);gate.connect(dst);
    const P={raw,out:dst.stream,gain:g,gate,db:-100,th:-50,open:true,hold:0,noise:-65,buf:new Float32Array(an.fftSize)};
    P.tick=setInterval(()=>{an.getFloatTimeDomainData(P.buf);let q=0;for(const v of P.buf)q+=v*v;const db=20*Math.log10(Math.sqrt(q/P.buf.length)+1e-9);P.db=db;
      if(micAuto()){P.noise=db<P.noise?P.noise*.85+db*.15:P.noise+.03;P.th=Math.min(-20,Math.max(-75,P.noise+14))}else P.th=micSens();
      const now=Date.now(),t=a.currentTime;
      if(db>P.th){P.hold=now+350;if(!P.open){P.open=true;gate.gain.setTargetAtTime(1,t,.008)}}
      else if(P.open&&now>P.hold){P.open=false;gate.gain.setTargetAtTime(0,t,.06)}},25);
    P.setVol=()=>{g.gain.value=micVol()/100};
    P.stop=()=>{clearInterval(P.tick);try{src.disconnect();g.disconnect();gate.disconnect()}catch(e){}raw.getTracks().forEach(x=>x.stop());P.out.getTracks().forEach(x=>x.stop())};
    return P}catch(e){console.warn('mic proc',e);return null}}
let MICP=null;
async function getCallMic(){const raw=await getMic();ac()?.resume?.();MICP?.stop();MICP=makeMicProc(raw);return MICP?MICP.out:raw}
function micMeter(md,P){const bar=md.querySelector('#lvl'),mk=md.querySelector('#lvlth');if(!bar)return;
  const pct=db=>Math.max(0,Math.min(100,(db+100)));bar.style.width=pct(P.db)+'%';bar.classList.toggle('open',P.open);if(mk)mk.style.left=pct(P.th)+'%'}
async function getCam(){const gum=v=>navigator.mediaDevices.getUserMedia({video:v,audio:false});
  const hd={width:{ideal:1280},height:{ideal:720}};let first;
  // tenta em ordem: câmera escolhida, padrão em HD, padrão simples, depois cada câmera do PC
  const tries=[];if(pref('cam'))tries.push({...hd,deviceId:{exact:pref('cam')}});tries.push(hd,true);
  for(const t of tries){try{return await gum(t)}catch(e){first??=e;if(e.name==='NotAllowedError'||e.name==='SecurityError')throw e}}
  try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'&&d.deviceId);
    for(const d of devs){try{const st=await gum({deviceId:{exact:d.deviceId}});ls.set('dev:cam',d.deviceId);return st}catch(e){}}
    if(!devs.length&&first?.name!=='NotReadableError')first=Object.assign(new Error('sem câmera'),{name:'NotFoundError'})}catch(e){}
  throw first}
function alertModal(t,msg){modal(`<h3>${esc(t)}</h3><p class="sub">${esc(msg)}</p><div class="row"><button class="btn" data-close>Ok</button></div>`)}
function camErrorMsg(e){const n=e?.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'A câmera está bloqueada para o Nexo. Clique no cadeado ao lado do endereço (ou nos ⋯ do app → Configurações do app) e deixe a Câmera em "Permitir".';
  if(n==='NotReadableError'||n==='AbortError'||n==='TrackStartError')return 'A câmera está sendo usada por outro programa (Discord, Zoom, OBS, Teams…). Feche ele e tente de novo. Se não tiver nenhum aberto, veja no Windows: Configurações → Privacidade e segurança → Câmera, e ligue "Permitir que aplicativos acessem a câmera".';
  if(n==='NotFoundError'||n==='OverconstrainedError'||n==='DevicesNotFoundError')return 'Não encontrei nenhuma câmera. Veja se ela está conectada e ligada (alguns notebooks têm uma tecla ou tampinha na câmera).';
  return 'Não consegui abrir a câmera ('+(n||'erro')+'). Feche outros programas que usam a câmera e tente de novo.'}
function applySink(el){const id=pref('out');if(el&&el.setSinkId&&id)el.setSinkId(id).catch(()=>{})}
function applyVolumes(){const vols=ls.get('vols',{});const master=ls.get('outvol',100)/100;
  for(const a of document.querySelectorAll('#audios audio')){const p=a.id.slice(3);const u=CALL?ROOMS[CALL.srv]?.peers[p]:null;const v=((vols[u]??100)/100)*master;a.volume=Math.min(1,v);
    // acima de 100%: usa um ganho extra
    if(v>1&&ac()){if(!a._g){try{const src=ac().createMediaElementSource(a);const g=ac().createGain();src.connect(g);g.connect(ac().destination);a._g=g}catch(e){}}if(a._g)a._g.gain.value=v}else if(a._g)a._g.gain.value=1}}
async function switchMic(){if(!CALL)return;const R=ROOMS[CALL.srv];const old=CALL.mic;let nm;try{nm=await getCallMic()}catch(e){toast('Não consegui usar esse microfone');return}
  const peers=callPeers();try{peers.length&&R.room.removeStream(old,peers)}catch(e){}old.getTracks().forEach(t=>t.stop());CALL.noMic=false;
  CALL.mic=nm;nm.getAudioTracks().forEach(t=>t.enabled=!CALL.mute);if(peers.length)R.room.addStream(nm,peers,{k:'mic'});levels.delete('me');watchLevel('me',nm)}
async function switchCamDevice(){if(!CALL?.cam)return;const R=ROOMS[CALL.srv];let ns;try{ns=await getCam()}catch(e){toast('Não consegui usar essa câmera');return}
  const peers=callPeers();try{peers.length&&R.room.removeStream(CALL.cam,peers)}catch(e){}CALL.cam.getTracks().forEach(t=>t.stop());CALL.cam=ns;if(peers.length)R.room.addStream(ns,peers,{k:'cam'});renderCall()}
let micTest=null;
function stopMicTest(){if(!micTest)return;cancelAnimationFrame(micTest.raf);micTest.P?.stop();try{micTest.loop?.pause()}catch(e){}micTest=null}
async function startMicTest(md,hear){stopMicTest();
  if(CALL&&MICP){micTest={P:null,raf:0};const tick=()=>{micMeter(md,MICP);micTest.raf=requestAnimationFrame(tick)};tick();return} // já está em chamada: mostra o microfone da chamada
  let st;try{st=await getMic()}catch(e){toast('Permita o microfone para testar');return}
  ac()?.resume?.();const P=makeMicProc(st);if(!P){st.getTracks().forEach(t=>t.stop());return}
  micTest={P,raf:0,loop:null};
  if(hear){const el=new Audio();el.srcObject=P.out;applySink(el);el.play().catch(()=>{});micTest.loop=el}
  const tick=()=>{micMeter(md,P);micTest.raf=requestAnimationFrame(tick)};tick()}
async function testOutput(){const a=ac();if(!a)return;a.resume?.();const dst=a.createMediaStreamDestination();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(dst);
  const t=a.currentTime;[523,659,784].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.18));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.03);g.gain.setValueAtTime(.25,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  const el=new Audio();el.srcObject=dst.stream;el.volume=ls.get('outvol',100)/100>1?1:ls.get('outvol',100)/100;applySink(el);await el.play().catch(()=>{});o.start(t);o.stop(t+.65);setTimeout(()=>el.pause(),900)}

/* nível de áudio (quem está falando) */
const levels=new Map();const speaking=new Set();
function watchLevel(key,stream){const a=ac();if(!a)return;try{const src=a.createMediaStreamSource(stream);const an=a.createAnalyser();an.fftSize=512;src.connect(an);levels.set(key,{an,buf:new Uint8Array(an.fftSize)})}catch(e){}}
setInterval(()=>{let changed=false;const now=new Set();
  for(const[k,{an,buf}]of levels){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}const rms=Math.sqrt(s/buf.length);
    if(rms>0.035){const u=k==='me'?ME.id:ROOMS[CALL?.srv]?.peers[k.slice(2)];if(u&&!(u===ME.id&&CALL?.mute))now.add(u)}}
  for(const u of now)if(!speaking.has(u))changed=true;for(const u of speaking)if(!now.has(u))changed=true;
  if(changed){speaking.clear();now.forEach(u=>speaking.add(u));document.querySelectorAll('[data-tu]').forEach(t=>t.classList.toggle('speak',speaking.has(t.dataset.tu)));
    if(V.srv)renderSide()}},150);

/* tela da chamada */
const tileEls=new Map();
function tileFor(key,u,stream,kind,self){let el=tileEls.get(key);
  if(!el){el=document.createElement('div');el.className='tile';el.dataset.key=key;tileEls.set(key,el);
    el.addEventListener('click',e=>{if(e.target.closest('.fs')){const v=el.querySelector('video');(v?.requestFullscreen?v:el).requestFullscreen?.().catch(()=>{});return}UI.focus=UI.focus===key?null:key;renderCall()})}
  el.dataset.tu=u;el.classList.toggle('self',!!self);el.classList.toggle('scr',kind==='screen');el.classList.toggle('speak',speaking.has(u)&&kind!=='screen');
  const v=VOICE[CALL?.srv]?.[u];const muted=self?CALL?.mute:v?.mute;const deaf=self?CALL?.deaf:v?.deaf;
  const label=`<div class="lbl">${(muted||deaf)&&kind!=='screen'?ico(deaf?'headoff':'micoff'):''}<span>${esc(nameOf(u))}${self?' (você)':''}${kind==='screen'?' — tela':''}</span></div>`;
  if(stream){let vid=el.querySelector('video');if(!vid){el.innerHTML='';vid=document.createElement('video');vid.autoplay=true;vid.playsInline=true;el.appendChild(vid);el.insertAdjacentHTML('beforeend','<div class="lbl"></div><button class="fs" title="Tela cheia">'+ico('full')+'</button>')}
    if(vid.srcObject!==stream){vid.srcObject=stream;vid.play().catch(()=>{})}vid.dataset.k=kind;if(self)vid.dataset.self=1;
    vid.muted=self||kind!=='screen'||!!CALL?.deaf;if(!self&&kind==='screen')applySink(vid);vid.classList.toggle('mirror',!!self&&kind==='cam');el.querySelector('.lbl').outerHTML=label}
  else{el.innerHTML=`${avatar(u,0,false)}${label}`}
  return el}
function renderCall(){if(!(V.srv&&chan()?.type==='voice'))return;const code=V.srv,ch=V.ch;const inThis=CALL&&CALL.srv===code&&CALL.ch===ch;
  const cj=$('#callJoin');const users=voiceUsers(code,ch);
  if(!inThis){cj.classList.add('on');
    cj.innerHTML=`<div style="font-size:52px">🔊</div><h2>${esc(chan().name)}</h2><p>${users.length?`${users.length} ${users.length>1?'pessoas estão':'pessoa está'} aqui agora`:'Ninguém está aqui ainda. Entre e chame seus amigos!'}</p>
    ${users.length?`<div class="who" style="display:flex;padding-left:8px">${users.slice(0,8).map(x=>avatar(x.u,44)).join('')}</div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="cb wide" data-joincall>${ico('mic')} Entrar com voz</button><button class="cb wide" data-joincall="cam">${ico('cam')} Entrar com vídeo</button></div>
    ${CALL?`<p style="font-size:13px">Você está em outra chamada — entrar aqui vai trocar de sala.</p>`:''}`;
    $('#grid').innerHTML='';$('#strip').innerHTML='';$('#ctrl').innerHTML='';tileEls.forEach(e=>e.remove());tileEls.clear();return}
  cj.classList.remove('on');
  const R=ROOMS[code];const items=[];
  for(const x of users){const self=x.u===ME.id;const peer=self?null:VOICE[code][x.u]?.peer;const rm=peer?REMOTE[peer]||{}:{};
    if(x.screen){const s=self?CALL.screen:rm.screen;items.push({key:(self?'me':peer)+':screen',u:x.u,stream:s||null,kind:'screen',self})}
    const cam=self?CALL.cam:(x.cam?rm.cam:null);items.push({key:(self?'me':peer)+':cam',u:x.u,stream:cam||null,kind:'cam',self})}
  const keys=new Set(items.map(i=>i.key));for(const[k,el]of tileEls)if(!keys.has(k)){el.remove();tileEls.delete(k)}
  if(UI.focus&&!keys.has(UI.focus))UI.focus=null;
  const grid=$('#grid'),strip=$('#strip');grid.classList.toggle('focus',!!UI.focus);
  if(UI.focus){const f=items.find(i=>i.key===UI.focus);grid.replaceChildren(tileFor(f.key,f.u,f.stream,f.kind,f.self));grid.firstChild.style.aspectRatio='auto';grid.firstChild.style.height='100%';
    strip.replaceChildren(...items.filter(i=>i.key!==UI.focus).map(i=>{const t=tileFor(i.key,i.u,i.stream,i.kind,i.self);t.style.aspectRatio='';t.style.height='';return t}))}
  else{const n=items.length;const W=grid.clientWidth||800,H=grid.clientHeight||500;let best=1,bs=0;
    for(let c=1;c<=n;c++){const r=Math.ceil(n/c);const w=Math.min((W-28-(c-1)*10)/c,((H-28-(r-1)*10)/r)*16/9);if(w>bs){bs=w;best=c}}
    grid.style.gridTemplateColumns=`repeat(${best},${Math.floor(bs)}px)`;
    grid.replaceChildren(...items.map(i=>{const t=tileFor(i.key,i.u,i.stream,i.kind,i.self);t.style.aspectRatio='';t.style.height='';return t}));strip.replaceChildren()}
  const canScreen=!!navigator.mediaDevices?.getDisplayMedia;
  $('#ctrl').innerHTML=`<button class="cb ${CALL.mute?'bad':''}" data-mute title="${CALL.mute?'Ativar microfone':'Silenciar'}">${ico(CALL.mute?'micoff':'mic')}</button>
   <button class="cb ${CALL.cam?'on':''}" data-cam title="${CALL.cam?'Desligar câmera':'Ligar câmera'}">${ico(CALL.cam?'cam':'camoff')}</button>
   ${CALL.cam&&matchMedia('(hover:none)').matches?`<button class="cb" data-flip title="Trocar câmera">🔄</button>`:''}
   ${canScreen?`<button class="cb ${CALL.screen?'on':''}" data-screen title="${CALL.screen?'Parar de compartilhar':'Compartilhar tela'}">${ico('screen')}</button>`:''}
   <button class="cb ${CALL.deaf?'bad':''}" data-deaf title="${CALL.deaf?'Ativar áudio':'Ensurdecer'}">${ico(CALL.deaf?'headoff':'head')}</button>

function compress(file,max=1280,q=.82,limit=350000,square){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const cv=document.createElement('canvas');let out;
  for(let k=0;k<7;k++){let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=m}
    const s=Math.min(1,max/Math.max(w,h));cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
    out=cv.toDataURL('image/jpeg',q);if(out.length<limit)break;max*=.8;q-=.07}
  out.length<limit*1.3?res(out):rej()};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

  <div class="opt"><div style="font-size:24px">3</div><div><b>Escolha "Adicionar à Tela de Início"</b><small>O ícone do Nexo aparece junto dos seus apps.</small></div></div>`
  :`<div class="opt"><div style="font-size:24px">1</div><div><b>Abra o menu do navegador</b><small>Os três pontinhos (⋮) no canto da tela.</small></div></div>
  <div class="opt"><div style="font-size:24px">2</div><div><b>Toque em "Instalar app" ou "Adicionar à tela inicial"</b><small>No computador, também aparece um ícone de instalar na barra de endereço.</small></div></div>`}
  <div class="row"><button class="btn" data-close>Entendi</button></div>`)}

/* ---- início ---- */
async function start(){
  const saved=await idb.get('data');if(saved&&saved.servers)DATA=saved;DATA.dms??={};
  for(const s of Object.values(DATA.servers)){s.read??={};s.members??={};s.msgs??={}}
  const v=ls.get('view',null);if(v){if(v.srv&&DATA.servers[v.srv]){V.srv=v.srv;V.ch=v.ch}else if(v.dm){V.dm=v.dm;DATA.dms[v.dm]??={msgs:{},read:0}}}
  if(V.srv){const c=DATA.servers[V.srv].channels[V.ch];if(!c||c.deleted||c.type==='voice')V.ch=Object.values(DATA.servers[V.srv].channels).filter(c=>!c.deleted&&c.type!=='voice').sort((a,b)=>a.order-b.order)[0]?.id||null}
  renderAll();renderMsgs(true);
  if(location.protocol==='file:')banner('Você abriu o Nexo como arquivo. Para chamadas e convites funcionarem, publique-o num site (https).');
  banner(location.protocol==='file:'?$('#banner').textContent:'Conectando…');
  await Promise.all([loadNet(),loadTurn(),loadRelay()]);loadCaps();setTimeout(checkUpdate,8000);
  if(location.protocol==='file:')banner('Você abriu o Nexo como arquivo. Para chamadas e convites funcionarem, publique-o num site (https).');
  for(const code in DATA.servers)connect(code);
  if(UI.listenSrv&&!DATA.servers[UI.listenSrv]){UI.listenSrv=null;ls.set('listen',null)}renderMusicBar();
  if(UI.listenSrv){const once=()=>{musicListen(UI.listenSrv,true);removeEventListener('pointerdown',once)};addEventListener('pointerdown',once)}
  const m=location.hash.match(/entrar=([a-z0-9]+)/i);if(m){joinServer(m[1]);history.replaceState(null,'',location.pathname)}
  renderAll();
  if(innerWidth<=700&&(V.ch||V.dm))document.body.classList.remove('nav');
}
if(!ME)onboarding();else start();
